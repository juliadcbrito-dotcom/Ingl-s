function eGram(b,i){const L=GRAM[i];const ans={};const typed={};
 b.innerHTML=`<h2>${esc(L.t)}</h2>
 <h3>Explicação</h3><div class="lesson">${L.ex}</div>
 <h3>Exemplos</h3><ul class="list ex">${L.eg.map((e,k)=>`<li><b lang="en">${esc(e[0])}</b><button type="button" class="hear" data-e="${k}" aria-label="Ouvir">▶</button><br><span class="empty">${esc(e[1])}</span></li>`).join('')}</ul>
 <h3>Erros comuns de brasileiros</h3><ul class="list">${L.err.map(e=>`<li>${e}</li>`).join('')}</ul>
 <h3>Exercícios</h3><p class="empty">Nas questões de digitar, escreva só o que vai na lacuna e toque em Conferir.</p>
 <div class="gbody" id="exs">${L.q.map((q,n)=>q.o?
   `<div class="gbody exq" data-q="${n}"><p lang="en"><b>${n+1}.</b> ${esc(q.q)}</p><div class="opts">${q.o.map((o,kk)=>`<button type="button" class="opt" data-k="${kk}" lang="en"><kbd>${'ABCD'[kk]}</kbd><span>${esc(o)}</span></button>`).join('')}</div></div>`:
   `<div class="gbody exq" data-q="${n}"><p lang="en"><b>${n+1}.</b> ${esc(q.q)}</p><div class="row" style="flex-wrap:nowrap"><input class="txt" id="t${i}_${n}" lang="en" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Resposta da questão ${n+1}"><button type="button" class="btn small" data-c="${n}">Conferir</button></div><p class="fb" hidden></p></div>`).join('')}</div>
 <div class="end"><p id="gs" class="clock" style="font-size:22px"></p><div class="row"><button type="button" class="btn ghost small" id="redo">Refazer exercícios</button></div></div>`;
 b.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>say(L.eg[+x.dataset.e][0],.9));
 const total=L.q.length;
 function upd(){const n=Object.keys(ans).length;let ok=0;Object.entries(ans).forEach(([q,v])=>{if(v)ok++});
  const gs=b.querySelector('#gs');gs.textContent=n?`${ok} de ${total} certas${n<total?` · faltam ${total-n}`:''}`:'';
  if(n===total){S.gram=S.gram||{};S.gram[i]=Math.max(S.gram[i]||0,ok);save();gs.textContent+=ok>=6?' · Muito bem!':' · Releia a explicação e refaça.'}}
 b.querySelectorAll('.exq').forEach(box=>{const n=+box.dataset.q,q=L.q[n];
  if(q.o){box.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{if(ans[n]!=null)return;const kk=+o.dataset.k;ans[n]=kk===q.a;
    box.querySelectorAll('.opt').forEach(x=>{const z=+x.dataset.k;x.disabled=true;if(z===q.a)x.classList.add('right');else if(z===kk)x.classList.add('wrong')});upd()})}
  else{const inp=box.querySelector('input'),btn=box.querySelector('[data-c]'),fb=box.querySelector('.fb');
   const check=()=>{if(ans[n]!=null||!inp.value.trim())return;const ok=q.a.some(a=>normA(a)===normA(inp.value));ans[n]=ok;inp.disabled=true;btn.disabled=true;fb.hidden=false;
    fb.innerHTML=ok?'<span class="good">Certo!</span>':`<span class="badt">Resposta:</span> <b lang="en">${esc(q.a[0])}</b>`;upd()};
   btn.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()}}});
 b.querySelector('#redo').onclick=()=>{render();window.scrollTo(0,0)};
}

/* ---------- timer ---------- */
const T={id:null,left:0,key:null,run:false,iv:null};
const tEl=document.getElementById('timer');
function tick(){if(!T.run)return;T.left--;paint();if(T.left<=0){clearInterval(T.iv);T.run=false;S.done[T.key]=true;save();beep();document.getElementById('tlabel').textContent='Bloco concluído e marcado.';document.getElementById('tpause').hidden=true;render()}}
function paint(){const m=Math.floor(T.left/60),s=T.left%60;document.getElementById('tclock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function startTimer(key,min,label){clearInterval(T.iv);T.key=key;T.left=min*60;T.run=true;tEl.hidden=false;document.getElementById('tpause').hidden=false;document.getElementById('tpause').textContent='Pausar';document.getElementById('tlabel').textContent=label;paint();T.iv=setInterval(tick,1000)}
document.getElementById('tpause').onclick=e=>{T.run=!T.run;e.target.textContent=T.run?'Pausar':'Continuar'};
document.getElementById('tstop').onclick=()=>{clearInterval(T.iv);T.run=false;tEl.hidden=true};
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.2);o.start(c.currentTime+t);o.stop(c.currentTime+t+.22)})}catch(e){}}

window.addEventListener('hashchange',render);
render();
</script>

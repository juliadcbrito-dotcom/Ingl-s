function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function curWeek(){const n=new Date();n.setHours(0,0,0,0);return Math.min(12,Math.max(0,Math.floor(Math.round((n-START)/864e5)/7)))}
function vocabFor(w){return w===12?VOCAB.flat():VOCAB[w]}
function gs(){S.games=S.games||{best:{},xp:0,played:0};return S.games}
function addXP(n){const g=gs();g.xp+=n;g.played++;save()}

 pares:{name:'Pares',skill:'Vocabulário',desc:'Jogo da memória: encontre cada palavra em inglês e o seu significado.',best:g=>g.best.pares?`Recorde: ${g.best.pares} jogadas`:'Ainda sem recorde',

 frase:{name:'Monte a frase',skill:'Gramática',desc:'Toque nas palavras embaralhadas na ordem certa. 5 frases do seu nível.',best:g=>g.best.frase!=null?`Recorde: ${g.best.frase} de 5`:'Ainda sem recorde',

 corrida:{name:'Contra o relógio',skill:'Gramática',desc:'60 segundos de perguntas rápidas: lacunas de gramática e vocabulário do tema. Erro custa 3 segundos.',best:g=>g.best.corrida!=null?`Recorde: ${g.best.corrida} pontos`:'Ainda sem recorde',

     const p=voc[Math.floor(Math.random()*voc.length)];const opts=shuffle([p,...shuffle(voc.filter(z=>z!==p)).slice(0,3)]);return{q:`What does “${esc(p[0])}” mean?`,o:opts.map(z=>z[1]),a:opts.indexOf(p)}}
    function draw(){cur=make();b.innerHTML=`<div class="row" style="justify-content:space-between"><span class="clock" id="ck">${left}s</span><span class="clock">${score} pts</span></div>

     b.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{if(+o.dataset.v===cur.a){score++;draw();b.querySelector('.qtext').classList.add('flash-ok')}else{wrong++;left=Math.max(0,left-3);o.classList.add('flash-no');o.disabled=true;upd()}})}

    function end(){clearInterval(GT);const g=gs();const rec=g.best.corrida==null||score>g.best.corrida;if(rec)g.best.corrida=score;addXP(score);b.innerHTML='';
     finishGame(b,`${score} pontos${rec?' — novo recorde!':''} (+${score} XP)`,`<p class="empty">${wrong} erro${wrong===1?'':'s'}.</p>`)}
    draw();GT=setInterval(()=>{left--;upd()},1000)}}},
 ditado:{name:'Ditado',skill:'Escuta',desc:'Ouça a frase lida em voz alta e escreva o que entendeu. Dá para ouvir devagar.',best:g=>g.best.ditado!=null?`Recorde: ${g.best.ditado}% de acerto`:'Ainda sem recorde',
  run(v){const b=shell(v,'Ditado','Escuta');

    const vs=speechSynthesis.getVoices().filter(x=>/^en[-_]/i.test(x.lang));if(vs.length)u.voice=vs.find(x=>/en[-_]US/i.test(x.lang))||vs[0];speechSynthesis.speak(u)}catch(e){}}
   function round(){b.innerHTML=`<p class="qmeta"><span>Frase ${r+1} de 5</span><span>Média: ${r?Math.round(tot/r):0}%</span></p>
    <div class="row"><button class="btn" id="pl" type="button">▶ Ouvir</button><button class="btn ghost" id="sl" type="button">Ouvir devagar</button></div>
    <label for="dit" class="empty">Escreva o que ouviu (pontuação não conta):</label><input class="txt" id="dit" lang="en" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row"><button class="btn small" id="ok" type="button">Conferir</button></div><div id="fb"></div>`;
    b.querySelector('#pl').onclick=()=>speak(.95);b.querySelector('#sl').onclick=()=>speak(.6);

    b.querySelector('#ok').onclick=()=>{const tgt=norm(list[r]);const got=norm(inp.value);const bag={};got.forEach(w=>bag[w]=(bag[w]||0)+1);let hit=0;

     const pct=Math.round(hit/tgt.length*100);tot+=pct;inp.disabled=true;b.querySelector('#ok').disabled=true;
     b.querySelector('#fb').innerHTML=`<p class="${pct>=80?'good':'badt'}">${pct}% das palavras</p><p lang="en" style="font-size:18px">${marked}</p><button class="btn small" id="nx" type="button" style="margin-top:8px">${r<4?'Próxima frase':'Ver resultado'}</button>`;
     b.querySelector('#nx').onclick=()=>{r++;if(r<5)round();else{const avg=Math.round(tot/5);const g=gs();g.best.ditado=Math.max(g.best.ditado||0,avg);addXP(Math.round(avg/10));b.innerHTML='';
      finishGame(b,`Média de ${avg}% de acerto. (+${Math.round(avg/10)} XP)`,'<p class="empty">Palavras em vermelho e sublinhadas são as que faltaram ou ficaram diferentes.</p>')}}};
    inp.focus({preventScroll:true})}

};

/* ---------- praticar ---------- */
let SAMPLE, AI_OFF=false, waitingSample=false, convCtl=null, FQ=null;
const SAMPLE_P=(async()=>{try{return (window.claude&&window.claude.use)?await window.claude.use('sample'):null}catch(e){return null}})();
SAMPLE_P.then(x=>{SAMPLE=x;if(waitingSample)render()});
function today(){return iso(new Date())}
function say(text,rate){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate||.95;
 const vs=speechSynthesis.getVoices().filter(x=>/^en[-_]/i.test(x.lang));if(vs.length)u.voice=vs.find(x=>/en[-_]US/i.test(x.lang))||vs[0];speechSynthesis.speak(u)}catch(e){}}
const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
function normW(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean).map(w=>/^\d+$/.test(w)&&+w<=12?NUMW[+w]:w)}
function compareSpoken(target,heard){const t=normW(target);const bag={};normW(heard).forEach(w=>bag[w]=(bag[w]||0)+1);let hit=0;
 const html=target.split(' ').map(w=>{const n=normW(w)[0];if(n&&bag[n]>0){bag[n]--;hit++;return`<span class="w-ok">${esc(w)}</span>`}return`<span class="w-miss">${esc(w)}</span>`}).join(' ');
 return{pct:Math.round(hit/Math.max(1,t.length)*100),html}}
function noAI(){return `<p class="note">Esta ferramenta usa o Claude${AI_OFF?', e o uso do Claude não foi autorizado nesta página':''}. Ela funciona quando o app é aberto dentro do Claude, pelo link do artifact. Na versão publicada em outro endereço, use Flashcards, Leitura (textos já gerados), Pronúncia e Jogos.</p>`}
function aiGate(b){if(SAMPLE===undefined){b.innerHTML='<p class="empty">Conectando ao Claude…</p>';waitingSample=true;return false}
 if(!SAMPLE||AI_OFF){b.innerHTML=noAI();return false}return true}
function handleErr(e,el){const code=e&&e.code;
 if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){AI_OFF=true;el.innerHTML=noAI();return}
 const m={rate_limited:'Muitos pedidos seguidos ou limite de uso do Claude atingido. Espere um pouco e tente de novo.',session_expired:'Sua sessão no Claude expirou. Entre de novo e tente outra vez.',invalid_json:'A resposta veio num formato inesperado. Tente de novo.',refused:'O Claude não respondeu a esse pedido. Mude o texto e tente de novo.',empty_completion:'O Claude não devolveu nada. Tente de novo.'}[code]||'A conexão com o Claude falhou. Tente de novo.';
 el.innerHTML=`<p class="badt">${m}</p>`}
function pshell(v,title,skill,sub){
 v.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><a class="btn ghost small" href="#praticar" style="text-decoration:none">← Praticar</a><span class="sk" style="--c:var(${SKC[skill]})">${skill}</span></div><h2>${title}</h2>${sub?`<p class="empty">${sub}</p>`:''}<div class="gbody" id="pbody"></div></div>`;
 return v.querySelector('#pbody')}
function addCards(list){S.custom=S.custom||[];let n=0;list.forEach(c=>{const en=String(c.en||'').trim(),pt=String(c.pt||'').trim();if(en&&pt&&!S.custom.some(x=>x.en===en)){S.custom.push({en,pt});n++}});FQ=null;save();return n}

/* flashcards */
const IV=[1,2,4,7,15,30];
function dueCards(){const t=today();S.srs=S.srs||{};const out=[];
 (S.custom||[]).forEach(c=>out.push({id:'c:'+c.en,en:c.en,pt:c.pt}));
 const uw=Math.min(11,curWeek());for(let w=0;w<=uw;w++)VOCAB[w].forEach(p=>out.push({id:'v:'+p[0],en:p[0],pt:p[1]}));
 const used=S.newDay===t?(S.newCount||0):0;
 return{all:out,due:out.filter(c=>S.srs[c.id]&&S.srs[c.id].due<=t),fresh:out.filter(c=>!S.srs[c.id]).slice(0,Math.max(0,10-used))}}
function vFlash(v){
 const b=pshell(v,'Flashcards','Vocabulário','Errou: volta hoje. Difícil: volta amanhã. Acertou: volta em 2, 4, 7, 15 e depois 30 dias. Até 10 cartões novos por dia.');
 b.innerHTML='<div id="sess" class="gbody"></div>';const sess=b.querySelector('#sess');
 const f=document.createElement('form');f.className='addf';
 f.innerHTML=`<h3>Criar cartão</h3><div class="two"><input class="txt" id="fen" lang="en" placeholder="Em inglês (de preferência uma frase)" required><input class="txt" id="fpt" placeholder="Significado em português" required></div><div class="row"><button class="btn small" type="submit">Adicionar</button><span class="empty" id="fmsg"></span></div>`;
 f.onsubmit=e=>{e.preventDefault();const n=addCards([{en:f.querySelector('#fen').value,pt:f.querySelector('#fpt').value}]);f.reset();f.querySelector('#fmsg').textContent=n?'Cartão criado. Ele aparece na próxima rodada.':'Esse cartão já existe.'};
 b.appendChild(f);
 if(!FQ){const d=dueCards();FQ=shuffle(d.due).concat(d.fresh)}
 function show(){
  if(!FQ.length){const d=dueCards();const fixed=Object.values(S.srs||{}).filter(e=>e.box>=3).length;
   sess.innerHTML=`<p class="good">Revisão do dia concluída.</p><p class="empty">${d.all.length} cartões liberados até agora · ${fixed} bem fixados.</p>`;return}
  const c=FQ[0];const isNew=!(S.srs&&S.srs[c.id]);
  sess.innerHTML=`<p class="qmeta"><span>${FQ.length} para hoje</span><span>${isNew?'Novo':'Revisão'}</span></p>
   <div class="fcard"><p class="fen" lang="en">${esc(c.en)}</p><p class="fpt" id="back" hidden>${esc(c.pt)}</p></div>
   <div class="row" id="act"><button class="btn ghost" id="hear" type="button">▶ Ouvir</button><button class="btn" id="rev" type="button">Mostrar resposta</button></div>`;
  sess.querySelector('#hear').onclick=()=>say(c.en.replace(/^Corrija: /,''),.9);
  sess.querySelector('#rev').onclick=()=>{sess.querySelector('#back').hidden=false;
   sess.querySelector('#act').innerHTML='<button class="btn ghost" type="button" data-g="0">Errei</button><button class="btn ghost" type="button" data-g="1">Difícil</button><button class="btn" type="button" data-g="2">Acertei</button>';
   sess.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>grade(c,+x.dataset.g))}}
 function grade(c,g){const t=today();S.srs=S.srs||{};const e=S.srs[c.id]||{box:0};
  if(!S.srs[c.id]){if(S.newDay!==t){S.newDay=t;S.newCount=0}S.newCount++}
  FQ.shift();
  if(g===0){e.box=0;e.due=t;FQ.push(c)}else if(g===1){e.due=iso(addDays(new Date(),1))}else{e.box=Math.min(5,e.box+1);e.due=iso(addDays(new Date(),IV[e.box]))}
  S.srs[c.id]=e;save();show()}
 show();
}

 if(WR)renderWR(out);
 b.querySelector('#wgo').onclick=async e=>{const txt=ta.value.trim();
  if((txt.match(/\S+/g)||[]).length<8){out.innerHTML='<p class="badt">Escreva pelo menos duas ou três frases antes de corrigir.</p>';return}
  const btn=e.currentTarget;btn.disabled=true;out.innerHTML='<p class="empty">Corrigindo… pode levar até um minuto.</p>';
  const prompt=`You are an English teacher for a Brazilian adult learner at CEFR A2 whose goal is B1. Correct the learner's text below.
Task the learner was given (in Portuguese): "${task}".
Reply with only JSON in this shape:
{"corrected": "the full text corrected, keeping the learner's ideas and voice", "score": 0-10 integer, "level": "A1"|"A2"|"B1"|"B2", "errors": [{"original": "the wrong excerpt", "fix": "the corrected excerpt", "why": "short explanation in Brazilian Portuguese"}], "good": "one thing done well, in Brazilian Portuguese", "tip": "one concrete tip for the next text, in Brazilian Portuguese"}
List at most 8 errors, the most important first. Ignore stylistic preferences that are not mistakes.
Learner's text:
"""
${txt.slice(0,6000)}
"""`;
  try{const r=await SAMPLE.json(prompt,{cache:false});if(!r||typeof r!=='object')throw{code:'invalid_json'};WR=r;S.writings=S.writings||[];S.writings.push({date:today(),score:Number(r.score)||0});save();renderWR(out)}
  catch(err){handleErr(err,out)}finally{btn.disabled=false}};
}
function renderWR(out){const r=WR;const errs=Array.isArray(r.errors)?r.errors:[];

let CV={turns:[],review:null},autoRead=false;
function rules(th){return `You are Sam, a friendly English conversation partner for a Brazilian adult learner at CEFR level A2 who wants to reach B1. Topic of this week: "${th}". Speak only English, with simple and natural vocabulary (A2 to B1). Reply in 1 to 3 short sentences and always end with one question. If the learner writes in Portuguese, answer in simple English and encourage them to try in English. Do not correct mistakes during the chat. Plain text only, no markdown, no emoji. Begin the conversation by greeting the learner and asking a first question about the topic.`}
function vConversa(v){const th=WEEKS[curWeek()].th;
 const b=pshell(v,'Conversa','Fala','Tema: '+th+'. Escreva em inglês como se estivesse falando. No fim, peça a correção.');
 if(!aiGate(b))return;
 b.innerHTML=`<div class="chat" id="chat" aria-live="polite"></div>
  <form id="cf" class="row" style="flex-wrap:nowrap"><input class="txt" id="cin" lang="en" autocomplete="off" placeholder="Write your answer…" aria-label="Sua mensagem"><button class="btn" type="submit" id="csend">Enviar</button></form>
  <label class="empty" for="auto"><input type="checkbox" id="auto" ${autoRead?'checked':''}> Ler as respostas em voz alta</label>
  <div class="row"><button class="btn ghost small" id="cend" type="button">Terminar e corrigir</button><button class="btn ghost small" id="cnew" type="button">Nova conversa</button></div><div id="cout" class="gbody"></div>`;
 const chat=b.querySelector('#chat'),cout=b.querySelector('#cout'),send=b.querySelector('#csend'),cin=b.querySelector('#cin');
 function draw(){chat.innerHTML=CV.turns.map((t,i)=>`<div class="bub ${t.role==='user'?'me':'ai'}" lang="en">${esc(t.content)}${t.role==='assistant'?`<button type="button" class="hear" data-i="${i}" aria-label="Ouvir">▶</button>`:''}</div>`).join('');
  if(!CV.turns.length)chat.innerHTML='<button class="btn" id="cstart" type="button" style="align-self:flex-start">Começar conversa</button>';
  const st=chat.querySelector('#cstart');if(st)st.onclick=()=>{chat.innerHTML='';ask()};
  chat.querySelectorAll('.hear').forEach(x=>x.onclick=()=>say(CV.turns[+x.dataset.i].content,.9));chat.scrollTop=chat.scrollHeight}
 async function ask(){const bub=document.createElement('div');bub.className='bub ai';bub.lang='en';bub.textContent='…';chat.appendChild(bub);chat.scrollTop=chat.scrollHeight;send.disabled=true;
  convCtl=new AbortController();
  try{const {text}=await SAMPLE([{role:'user',content:rules(th)},...CV.turns.slice(-30)],{cache:false,modelTier:'quick',signal:convCtl.signal,onText:({text})=>{bub.textContent=text;chat.scrollTop=chat.scrollHeight}});
   CV.turns.push({role:'assistant',content:text});draw();if(autoRead)say(text,.95)}
  catch(e){bub.remove();if(e.code!=='cancelled')handleErr(e,cout)}finally{send.disabled=false;cin.focus({preventScroll:true})}}
 b.querySelector('#cf').onsubmit=e=>{e.preventDefault();const t=cin.value.trim();if(!t||send.disabled)return;cin.value='';CV.turns.push({role:'user',content:t});draw();ask()};
 b.querySelector('#auto').onchange=e=>{autoRead=e.target.checked};
 b.querySelector('#cnew').onclick=()=>{try{convCtl&&convCtl.abort()}catch(e){}CV={turns:[],review:null};render()};
 b.querySelector('#cend').onclick=async e=>{const mine=CV.turns.filter(t=>t.role==='user').map(t=>t.content);
  if(!mine.length){cout.innerHTML='<p class="badt">Escreva pelo menos uma mensagem antes de pedir a correção.</p>';return}
  const btn=e.currentTarget;btn.disabled=true;cout.innerHTML='<p class="empty">Analisando suas mensagens…</p>';
  try{const r=await SAMPLE.json(`A Brazilian adult learner of English (CEFR A2, goal B1) wrote these messages in a conversation about "${th}". Reply with only JSON:
{"fixes": [{"original": "...", "fix": "...", "why": "short explanation in Brazilian Portuguese"}], "useful": [{"en": "a natural phrase for this topic", "pt": "Portuguese translation"}], "feedback": "two encouraging, specific sentences in Brazilian Portuguese"}
At most 8 fixes (only real mistakes, most important first) and exactly 5 useful phrases.
Messages:
${mine.slice(-25).map(m=>'- '+m).join('\n')}`,{cache:false});
   CV.review=r;renderReview()}catch(err){handleErr(err,cout)}finally{btn.disabled=false}};
 function renderReview(){const r=CV.review;if(!r)return;const fx=Array.isArray(r.fixes)?r.fixes:[],us=Array.isArray(r.useful)?r.useful:[];
  cout.innerHTML=`<div class="end">${r.feedback?`<p>${esc(r.feedback)}</p>`:''}
  <h3>Correções</h3>${fx.length?`<ul class="list">${fx.map(x=>`<li><span class="w-miss" lang="en">${esc(x.original)}</span> → <b class="w-ok" lang="en">${esc(x.fix)}</b><br><span class="empty">${esc(x.why)}</span></li>`).join('')}</ul>`:'<p class="good">Nenhum erro importante.</p>'}
  <h3>Frases úteis</h3><ul class="list">${us.map(x=>`<li><b lang="en">${esc(x.en)}</b> = ${esc(x.pt)}</li>`).join('')}</ul>
  <div class="row"><button class="btn ghost small" id="c2f" type="button">Mandar para os flashcards</button><span class="empty" id="c2m"></span></div></div>`;
  cout.querySelector('#c2f').onclick=ev=>{const n=addCards(us.map(x=>({en:x.en,pt:x.pt})).concat(fx.map(x=>({en:'Corrija: '+x.original,pt:x.fix}))));cout.querySelector('#c2m').textContent=n+' cartões criados.';ev.currentTarget.disabled=true}}
 draw();renderReview();
}

const GRAM=[
{t:"Present simple × present continuous",
 ex:`<p><b>Present simple</b> fala de rotina, hábitos e fatos que são sempre verdade.</p>
<div class="formula">I/you/we/they <b>work</b> · he/she/it <b>works</b><br>Negativa: I <b>don't</b> work · she <b>doesn't</b> work<br>Pergunta: <b>Do</b> you work? · <b>Does</b> she work?</div>
<p><b>Present continuous</b> fala do que está acontecendo agora ou neste período.</p>
<div class="formula">am / is / are + verbo<b>-ing</b><br>I <b>am studying</b> · she <b>is working</b> · they <b>are living</b></div>
<p>Palavras que ajudam: <i>every day, usually, always, never</i> → present simple. <i>now, right now, at the moment, this week</i> → present continuous.</p>
<p>Verbos de estado quase nunca vão para -ing: <i>like, love, want, need, know, understand, believe</i>. Diga <i>I know</i>, não <i>I am knowing</i>.</p>`,
 eg:[["I live in Sorocaba.","Eu moro em Sorocaba."],["She usually takes the bus to work.","Ela normalmente pega ônibus para o trabalho."],["I'm writing my dissertation this month.","Estou escrevendo minha dissertação este mês."],["Look! It's raining.","Olha! Está chovendo."]],
 err:["Esquecer o -s na 3ª pessoa: <i>she work</i> ✗ → <i>she works</i> ✓","Usar -ing para rotina: <i>I am going to the gym every day</i> ✗ → <i>I go to the gym every day</i> ✓"],
 q:[{q:"She ___ English every morning.",o:["study","studies","is studying","studying"],a:1},
 {q:"Be quiet, please. I ___ on the phone.",o:["talk","talks","am talking","talking"],a:2},
 {q:"___ you work on Saturdays?",o:["Are","Do","Does","Is"],a:1},
 {q:"I ___ the answer.",o:["know","am knowing","knows","knowing"],a:0},
 {q:"This week we ___ a new project.",o:["start","are starting","starts","starting"],a:1},
 {q:"He ___ (not / like) coffee.",a:["doesn't like","does not like"]},
 {q:"Water ___ (boil) at 100 degrees.",a:["boils"]},

{t:"Past simple (regulares e irregulares)",

<div class="formula">Regulares: verbo + <b>-ed</b> → work<b>ed</b>, stud<b>ied</b>, stop<b>ped</b><br>Irregulares: go → <b>went</b>, have → <b>had</b>, make → <b>made</b>, see → <b>saw</b><br>Negativa e pergunta usam <b>did</b> + verbo na forma base:<br>I <b>didn't go</b> · <b>Did</b> you <b>go</b>?</div>
<p>Depois de <i>did</i> e <i>didn't</i>, o verbo volta para a forma base: <i>Did you see?</i>, nunca <i>Did you saw?</i></p>
<p>Irregulares essenciais: be → was/were, do → did, get → got, take → took, come → came, give → gave, write → wrote, read → read, buy → bought, think → thought, find → found, leave → left.</p>`,
 eg:[["I graduated in 2024.","Eu me formei em 2024."],["We went to Ourinhos last weekend.","Fomos para Ourinhos no fim de semana passado."],["She didn't finish the map.","Ela não terminou o mapa."],["Did you see the news?","Você viu a notícia?"]],

 q:[{q:"I ___ my master's in 2025.",o:["start","started","starting","starts"],a:1},
 {q:"We ___ to the beach last summer.",o:["go","goed","went","gone"],a:2},

{t:"Futuro: will, going to e present continuous",
 ex:`<p>O inglês tem três jeitos comuns de falar do futuro:</p>
<div class="formula"><b>going to</b> + verbo → plano ou intenção já decidida<br><b>will</b> + verbo → decisão na hora, promessa, previsão, oferta<br><b>present continuous</b> → compromisso marcado (com data/hora)</div>
<ul><li><i>I'm going to study English every day.</i> (já decidi)</li><li><i>The phone is ringing. I'll answer it.</i> (decidi agora)</li><li><i>I'm meeting my advisor on Friday at 2 pm.</i> (está na agenda)</li></ul>
<p>Para previsões, use <i>going to</i> quando há uma evidência agora: <i>Look at those clouds. It's going to rain.</i></p>`,
 eg:[["I'm going to apply for that job.","Vou me candidatar àquela vaga."],["Don't worry, I'll help you.","Não se preocupe, eu te ajudo."],["We're having dinner with my parents tonight.","Vamos jantar com meus pais hoje à noite."],["I think it will be a good year.","Acho que vai ser um bom ano."]],
 err:["Esquecer o <i>be</i>: <i>I going to travel</i> ✗ → <i>I'm going to travel</i> ✓","<i>I will to go</i> ✗ → <i>I will go</i> ✓ (sem <i>to</i> depois de <i>will</i>)"],
 q:[{q:"I've decided. I ___ learn Python next year.",o:["will","am going to","going to","am"],a:1},
 {q:"It's cold in here. — OK, I ___ close the window.",o:["'ll","'m going to","am closing","close"],a:0},
 {q:"We ___ the dentist tomorrow at 10.",o:["see","are seeing","will to see","sees"],a:1},
 {q:"Look at the sky! It ___ rain.",o:["is going to","will to","goes","raining"],a:0},
 {q:"I promise I ___ tell anyone.",o:["won't","am not going","don't","not will"],a:0},
 {q:"She ___ (going to / visit) her family in December.",a:["is going to visit","'s going to visit"]},
 {q:"I think you ___ (pass) the interview. (will)",a:["will pass","'ll pass"]},
 {q:"I ___ (meet) my friends tonight. (compromisso marcado: am + -ing)",a:["am meeting","'m meeting"]}]},

{t:"Comparativos e superlativos",
 ex:`<p>Para comparar duas coisas, usamos o <b>comparativo</b> + <i>than</i>. Para dizer que algo é o máximo de um grupo, usamos o <b>superlativo</b> com <i>the</i>.</p>
<div class="formula">Adjetivo curto: hot → hot<b>ter</b> than → <b>the</b> hot<b>test</b><br>Terminado em -y: busy → bus<b>ier</b> → the bus<b>iest</b><br>Adjetivo longo: expensive → <b>more</b> expensive than → <b>the most</b> expensive<br>Irregulares: good → better → the best · bad → worse → the worst · far → further → the furthest</div>
<p>Para igualdade: <i>as + adjetivo + as</i> → <i>Sorocaba is not as big as São Paulo.</i></p>`,
 eg:[["Summer is hotter than winter.","O verão é mais quente que o inverno."],["This is the most important chapter.","Este é o capítulo mais importante."],["My English is better than last year.","Meu inglês está melhor que no ano passado."],["The city is not as green as it was.","A cidade não é tão verde quanto era."]],
 err:["<i>more big</i> ✗ → <i>bigger</i> ✓","Trocar <i>than</i> por <i>that</i>: <i>bigger that</i> ✗ → <i>bigger than</i> ✓"],
 q:[{q:"São Paulo is ___ than Sorocaba.",o:["more big","bigger","biggest","the bigger"],a:1},
 {q:"This is ___ map I have ever made.",o:["the best","the better","best","the goodest"],a:0},
 {q:"QGIS is ___ than other GIS programs for me.",o:["more easy","easyer","easier","the easiest"],a:2},
 {q:"Today is not ___ hot as yesterday.",o:["so","as","than","more"],a:1},
 {q:"It was ___ day of the year.",o:["the hottest","the hotter","hottest","the most hot"],a:0},
 {q:"Write the comparative: expensive → ___ expensive",a:["more"]},
 {q:"Write the superlative: busy → the ___",a:["busiest"]},
 {q:"My results were ___ (bad) than I expected.",a:["worse"]}]},

{t:"Contáveis e incontáveis: much, many, a lot of, few, little, some, any",
 ex:`<p>Substantivos <b>contáveis</b> têm plural (<i>trees, maps, cities</i>). <b>Incontáveis</b> não têm plural (<i>water, rain, information, advice, money, time</i>).</p>
<div class="formula"><b>many</b> + contável · <b>much</b> + incontável (mais em perguntas e negativas)<br><b>a lot of</b> → serve para os dois<br><b>a few</b> + contável · <b>a little</b> + incontável (= um pouco, quantidade positiva)<br><b>few / little</b> sem \"a\" → quase nada (sentido negativo)<br><b>some</b> em afirmativas e ofertas · <b>any</b> em negativas e perguntas</div>
<p>Pergunte quantidade com <i>How many trees?</i> e <i>How much water?</i></p>`,
 eg:[["There are a lot of trees in this park.","Há muitas árvores neste parque."],["We don't have much time.","Não temos muito tempo."],["Can I ask you a few questions?","Posso te fazer algumas perguntas?"],["Is there any information about it?","Há alguma informação sobre isso?"]],
 err:["<i>informations, advices</i> ✗ → <i>information, advice</i> ✓ (não têm plural)","<i>How many money?</i> ✗ → <i>How much money?</i> ✓"],
 q:[{q:"How ___ rain fell last month?",o:["many","much","few","a few"],a:1},
 {q:"There aren't ___ parks in my neighbourhood.",o:["much","many","little","a little"],a:1},
 {q:"I need ___ information about the course.",o:["an","many","some","a few"],a:2},
 {q:"Do you have ___ questions?",o:["any","much","a little","some of"],a:0},
 {q:"I speak ___ Spanish, so I can help a bit.",o:["a few","a little","many","few"],a:1},
 {q:"Choose the correct word: She gave me good ___.",o:["advices","advice","an advice","many advice"],a:1},
 {q:"How ___ cities did you visit? (many/much)",a:["many"]},
 {q:"I have ___ friends in Chile, maybe three. (a few / a little)",a:["a few"]}]},

{t:"Modais: can, could, must, have to, should",
 ex:`<p>Os modais vêm antes do verbo na forma base, <b>sem to</b> e <b>sem -s</b>.</p>
<div class="formula"><b>can</b> → habilidade, permissão, possibilidade (<i>I can use QGIS.</i>)<br><b>could</b> → habilidade no passado ou pedido educado (<i>Could you help me?</i>)<br><b>must</b> → obrigação forte, muitas vezes da própria pessoa ou regra escrita<br><b>have to</b> → obrigação externa (regra, chefe, lei); muda: <i>she has to</i>, <i>I had to</i><br><b>should</b> → conselho (<i>You should rest.</i>)</div>
<p>Atenção às negativas: <b>mustn't</b> = é proibido. <b>don't have to</b> = não é necessário.</p>`,
 eg:[["I can speak a little English.","Eu sei falar um pouco de inglês."],["Could you repeat that, please?","Você poderia repetir, por favor?"],["You don't have to come early.","Você não precisa vir cedo."],["You should practise every day.","Você deveria praticar todo dia."]],
 err:["<i>I can to swim</i> ✗ → <i>I can swim</i> ✓","<i>She cans</i> ✗ → <i>She can</i> ✓","Confundir <i>mustn't</i> (proibido) com <i>don't have to</i> (não precisa)."],
 q:[{q:"I ___ use QGIS and R.",o:["can","can to","cans","must to"],a:0},
 {q:"___ you open the window, please?",o:["Should","Could","Must","Have"],a:1},
 {q:"You look tired. You ___ go to bed early.",o:["should","must to","have","can to"],a:0},
 {q:"It's Sunday. I ___ work today. (não é necessário)",o:["mustn't","don't have to","can't to","shouldn't to"],a:1},
 {q:"You ___ smoke in the hospital. (é proibido)",o:["mustn't","don't have to","haven't to","couldn't"],a:0},
 {q:"She ___ wear a uniform at work. (have to)",a:["has to"]},
 {q:"When I was a child, I ___ swim. (could)",a:["could"]},
 {q:"Last year I ___ to work on Saturdays. (passado de have)",a:["had"]}]},

{t:"Present perfect: experiências (ever, never)",
 ex:`<p>O <b>present perfect</b> liga o passado ao presente. Um uso muito comum é falar de <b>experiências de vida</b>, sem dizer quando aconteceram.</p>
<div class="formula">have / has + <b>particípio</b><br>I <b>have worked</b> with GIS. · She <b>has been</b> to Chile.<br>Pergunta: <b>Have</b> you ever <b>used</b> Python?<br>Negativa: I <b>have never been</b> to Europe.</div>
<p>Particípios importantes: be → <b>been</b>, do → <b>done</b>, go → <b>gone/been</b>, see → <b>seen</b>, write → <b>written</b>, take → <b>taken</b>, give → <b>given</b>, make → <b>made</b>, have → <b>had</b>.</p>
<p>Se você disser <b>quando</b> (yesterday, in 2023), use o past simple.</p>`,
 eg:[["I have worked on a management plan.","Já trabalhei num plano de manejo."],["Have you ever taught a class?","Você já deu aula?"],["She has never been abroad.","Ela nunca foi ao exterior."],["We have written three chapters.","Escrevemos três capítulos."]],
 err:["<i>I have went</i> ✗ → <i>I have been / I have gone</i> ✓","<i>Did you ever...?</i> é possível, mas para experiências o natural é <i>Have you ever...?</i>"],
 q:[{q:"___ you ever been to the beach in winter?",o:["Did","Have","Has","Are"],a:1},
 {q:"She has ___ a book chapter.",o:["write","wrote","written","writing"],a:2},
 {q:"I have never ___ Japanese food.",o:["eat","ate","eaten","eating"],a:2},
 {q:"He ___ worked in many schools.",o:["have","has","is","did"],a:1},
 {q:"I ___ to Argentina in 2022.",o:["have been","went","have gone","was go"],a:1},
 {q:"Have you ever ___ (see) a tornado?",a:["seen"]},
 {q:"I ___ (never / be) to Europe. (have)",a:["have never been","'ve never been"]},
 {q:"We ___ (do) this exercise before. (have)",a:["have done","'ve done"]}]},

{t:"Present perfect × past simple (for, since, already, yet, just)",
 ex:`<p><b>Past simple</b>: ação terminada, com tempo definido. <b>Present perfect</b>: ação que começou no passado e continua, ou resultado importante agora, sem tempo definido.</p>
<div class="formula"><b>for</b> + período → for two years, for a long time<br><b>since</b> + ponto de início → since 2025, since Monday<br><b>already</b> (já) → afirmativas: I've <b>already</b> sent it.<br><b>yet</b> (já? / ainda não) → final de perguntas e negativas: Have you finished <b>yet</b>? I haven't finished <b>yet</b>.<br><b>just</b> (acabei de) → I've <b>just</b> arrived.</div>
<p>Em português dizemos \"moro aqui há dois anos\". Em inglês: <i>I <b>have lived</b> here <b>for</b> two years</i> (nunca <i>I live here for two years</i>).</p>`,
 eg:[["I have lived in Sorocaba since 2025.","Moro em Sorocaba desde 2025."],["I've known her for ten years.","Conheço ela há dez anos."],["Have you sent the abstract yet?","Você já mandou o resumo?"],["I've just finished the map.","Acabei de terminar o mapa."]],
 err:["<i>I live here since 2025</i> ✗ → <i>I have lived here since 2025</i> ✓","<i>I have finished it yesterday</i> ✗ → <i>I finished it yesterday</i> ✓"],
 q:[{q:"I have studied English ___ six months.",o:["since","for","ago","during"],a:1},
 {q:"She has worked here ___ January.",o:["for","since","ago","in"],a:1},
 {q:"Have you finished your dissertation ___?",o:["already","yet","just","since"],a:1},
 {q:"I ___ the article last night.",o:["have read","read","have readed","was read"],a:1},
 {q:"We've ___ arrived. Give us a minute.",o:["yet","just","since","for"],a:1},
 {q:"How long ___ you lived in this city?",o:["do","did","have","are"],a:2},
 {q:"I ___ (already / send) the email. (have)",a:["have already sent","'ve already sent"]},
 {q:"They ___ (not / call) me yet.",a:["haven't called","have not called"]}]},

{t:"Past continuous × past simple (when, while)",
 ex:`<p>O <b>past continuous</b> descreve uma ação em andamento no passado. Muitas vezes ela é interrompida por uma ação curta no <b>past simple</b>.</p>
<div class="formula">was / were + verbo<b>-ing</b><br>I <b>was walking</b> home <b>when</b> it <b>started</b> to rain.<br><b>While</b> she <b>was cooking</b>, I <b>was cleaning</b>. (duas ações longas ao mesmo tempo)</div>
<p><b>when</b> costuma vir com a ação curta. <b>while</b> costuma vir com a ação longa.</p>`,
 eg:[["I was working when you called.","Eu estava trabalhando quando você ligou."],["What were you doing at 8 pm?","O que você estava fazendo às 8 da noite?"],["While I was waiting, I read the news.","Enquanto eu esperava, li as notícias."],["The traffic was moving slowly.","O trânsito estava andando devagar."]],
 err:["<i>I was work</i> ✗ → <i>I was working</i> ✓","<i>They was</i> ✗ → <i>They were</i> ✓"],
 q:[{q:"I ___ a shower when the phone rang.",o:["took","was taking","am taking","take"],a:1},
 {q:"They ___ football when it started to rain.",o:["was playing","were playing","played","are playing"],a:1},
 {q:"While I was driving, I ___ an accident.",o:["was see","saw","seeing","see"],a:1},
 {q:"What ___ you doing yesterday at 10?",o:["was","were","did","are"],a:1},
 {q:"She was reading ___ I was studying.",o:["while","when","during","for"],a:0},
 {q:"I ___ (walk) to work when I met an old friend.",a:["was walking"]},
 {q:"The children ___ (sleep) when we arrived.",a:["were sleeping"]},
 {q:"When the lights went out, we ___ (watch) TV.",a:["were watching"]}]},

{t:"Preposições de tempo e lugar: in, on, at",
 ex:`<p>As três preposições vão do mais geral ao mais específico.</p>
<div class="formula"><b>Tempo</b><br><b>in</b> → meses, anos, estações, partes do dia: in May, in 2026, in summer, in the morning<br><b>on</b> → dias e datas: on Monday, on 25 December, on my birthday<br><b>at</b> → horas e momentos: at 9 o'clock, at night, at the weekend (britânico), at Christmas</div>
<div class="formula"><b>Lugar</b><br><b>in</b> → dentro, cidades e países: in the room, in Sorocaba, in Brazil<br><b>on</b> → superfícies, ruas, andares: on the table, on Paulista Avenue, on the second floor<br><b>at</b> → pontos e endereços: at home, at work, at the university, at 120 Main Street</div>`,
 eg:[["My class starts at 8 in the morning.","Minha aula começa às 8 da manhã."],["I was born in June.","Nasci em junho."],["The meeting is on Thursday.","A reunião é na quinta."],["She is at the university now.","Ela está na universidade agora."]],
 err:["<i>in Monday</i> ✗ → <i>on Monday</i> ✓","<i>in home</i> ✗ → <i>at home</i> ✓"],
 q:[{q:"My birthday is ___ March.",o:["in","on","at","to"],a:0},
 {q:"I have a meeting ___ Friday.",o:["in","on","at","for"],a:1},
 {q:"The bus leaves ___ 7:30.",o:["in","on","at","by"],a:2},
 {q:"I live ___ Sorocaba.",o:["in","on","at","to"],a:0},
 {q:"The map is ___ the wall.",o:["in","on","at","into"],a:1},
 {q:"I'm ___ work right now.",o:["in","on","at","to"],a:2},
 {q:"We usually travel ___ January. (in/on/at)",a:["in"]},
 {q:"I study ___ night. (in/on/at)",a:["at"]}]},

{t:"Condicionais zero e primeira (if, when)",
 ex:`<p><b>Zero conditional</b>: verdades gerais e resultados sempre iguais.</p>
<div class="formula">If + present simple, present simple<br>If you <b>heat</b> ice, it <b>melts</b>.</div>
<p><b>First conditional</b>: situação real e possível no futuro.</p>
<div class="formula">If + present simple, <b>will</b> + verbo<br>If it <b>rains</b> tomorrow, we <b>will stay</b> home.</div>
<p>Depois de <i>if</i> e <i>when</i> não se usa <i>will</i>: <i>If I <b>get</b> the job</i>, não <i>If I will get</i>. A ordem pode inverter: <i>We will stay home if it rains.</i> (sem vírgula)</p>`,
 eg:[["If you don't water plants, they die.","Se você não rega as plantas, elas morrem."],["If I have time, I'll call you.","Se eu tiver tempo, te ligo."],["When I finish my master's, I'll look for a job.","Quando eu terminar o mestrado, vou procurar emprego."],["You'll learn faster if you practise every day.","Você vai aprender mais rápido se praticar todo dia."]],
 err:["<i>If it will rain</i> ✗ → <i>If it rains</i> ✓","Traduzir o subjuntivo: \"se eu tiver\" → <i>if I have</i> (presente), não <i>if I will have</i>."],
 q:[{q:"If you mix red and white, you ___ pink.",o:["get","will got","got","getting"],a:0},
 {q:"If it ___ tomorrow, I'll take an umbrella.",o:["will rain","rains","rained","rain"],a:1},
 {q:"If I pass the test, I ___ very happy.",o:["am","will be","would be","was"],a:1},
 {q:"When she ___ home, she'll call you.",o:["gets","will get","got","get"],a:0},
 {q:"We won't finish on time if we ___ now.",o:["don't start","won't start","didn't start","not start"],a:0},
 {q:"If you ___ (study) every day, you will improve.",a:["study"]},
 {q:"If I see her, I ___ (tell) her. (will)",a:["will tell","'ll tell"]},
 {q:"If you heat water to 100 °C, it ___ (boil).",a:["boils"]}]},

{t:"Segunda condicional (if I were, I would)",
 ex:`<p>A <b>second conditional</b> fala de situações imaginárias, improváveis ou contrárias à realidade agora.</p>
<div class="formula">If + past simple, <b>would</b> + verbo<br>If I <b>had</b> more time, I <b>would travel</b> more.<br>If I <b>were</b> you, I <b>would apply</b> for that job.</div>
<p>Apesar da forma no passado, o sentido é presente ou futuro. Com <i>be</i>, o mais correto é <b>were</b> para todas as pessoas: <i>If I were, if she were</i>.</p>
<p>Compare: <i>If I get the job, I'll move</i> (é possível) × <i>If I got a job in Japan, I'd move</i> (é pouco provável).</p>`,
 eg:[["If I lived near the beach, I would swim every day.","Se eu morasse perto da praia, nadaria todo dia."],["If I were you, I would rest.","Se eu fosse você, descansaria."],["What would you do if you won the lottery?","O que você faria se ganhasse na loteria?"],["She would help if she had time.","Ela ajudaria se tivesse tempo."]],
 err:["<i>If I would have money</i> ✗ → <i>If I had money</i> ✓","<i>I would to go</i> ✗ → <i>I would go</i> ✓"],
 q:[{q:"If I ___ rich, I would buy a house.",o:["am","were","will be","would be"],a:1},
 {q:"If she had a car, she ___ drive to work.",o:["will","would","is","did"],a:1},
 {q:"What would you do if you ___ the job?",o:["lose","lost","will lose","would lose"],a:1},
 {q:"If I were you, I ___ talk to the professor.",o:["will","would","am","was"],a:1},
 {q:"We would travel more if we ___ more money.",o:["have","had","would have","has"],a:1},
 {q:"If I ___ (know) the answer, I would tell you.",a:["knew"]},
 {q:"If he studied more, he ___ (pass). (would)",a:["would pass","'d pass"]},
 {q:"If I ___ (be) you, I would accept the offer.",a:["were"]}]},

{t:"Gerúndio × infinitivo (enjoy doing, want to do)",
 ex:`<p>Alguns verbos são seguidos de <b>-ing</b> e outros de <b>to + verbo</b>. É preciso memorizar os mais comuns.</p>
<div class="formula"><b>+ -ing</b>: enjoy, finish, avoid, mind, suggest, keep, practise, consider, spend time<br><b>+ to</b>: want, need, decide, hope, plan, learn, agree, promise, would like<br><b>Os dois, mesmo sentido</b>: like, love, hate, start, begin</div>
<p>Depois de <b>preposição</b>, sempre -ing: <i>I'm interested <b>in learning</b>. Thank you <b>for helping</b>. I'm good <b>at making</b> maps.</i></p>
<p>O -ing também funciona como sujeito: <i><b>Reading</b> helps your vocabulary.</i></p>`,
 eg:[["I enjoy teaching geography.","Eu gosto de ensinar geografia."],["I want to improve my English.","Quero melhorar meu inglês."],["She finished writing the chapter.","Ela terminou de escrever o capítulo."],["I'm interested in working with GIS.","Tenho interesse em trabalhar com SIG."]],
 err:["<i>I enjoy to read</i> ✗ → <i>I enjoy reading</i> ✓","<i>interested in work</i> ✗ → <i>interested in working</i> ✓"],
 q:[{q:"I enjoy ___ podcasts in English.",o:["listen","to listen","listening","listened"],a:2},
 {q:"She decided ___ a master's degree.",o:["doing","to do","do","done"],a:1},
 {q:"Have you finished ___ the report?",o:["to write","writing","write","wrote"],a:1},
 {q:"I'm good at ___ maps.",o:["make","to make","making","made"],a:2},
 {q:"We hope ___ you soon.",o:["seeing","to see","see","seen"],a:1},
 {q:"I need ___ (practise) speaking more.",a:["to practise","to practice"]},
 {q:"Would you mind ___ (open) the door?",a:["opening"]},
 {q:"Thank you for ___ (help) me.",a:["helping"]}]},

{t:"Used to (hábitos do passado)",
 ex:`<p><b>used to</b> + verbo fala de hábitos ou situações do passado que <b>não acontecem mais</b>.</p>
<div class="formula">I <b>used to live</b> in Ourinhos. (morava, não moro mais)<br>Negativa: I <b>didn't use to</b> like coffee.<br>Pergunta: <b>Did</b> you <b>use to</b> play sports?</div>
<p>Na negativa e na pergunta, com <i>did</i>, escreve-se <b>use to</b> (sem d).</p>
<p>Cuidado: <b>be used to + -ing</b> é outra coisa, significa \"estar acostumado\": <i>I'm used to waking up early.</i></p>`,
 eg:[["I used to work as a waitress.","Eu trabalhava como garçonete."],["We used to play in the street.","A gente brincava na rua."],["She didn't use to speak English.","Ela não falava inglês."],["Did you use to live in the countryside?","Você morava no interior?"]],
 err:["<i>I use to live</i> ✗ (no passado) → <i>I used to live</i> ✓","Usar <i>used to</i> para o presente: para hábitos atuais use <i>usually</i>: <i>I usually wake up at 7</i>."],
 q:[{q:"When I was a child, I ___ climb trees.",o:["use to","used to","was used to","usually"],a:1},
 {q:"She ___ like vegetables, but now she loves them.",o:["didn't use to","didn't used to","not used to","wasn't use to"],a:0},
 {q:"___ you use to walk to school?",o:["Do","Did","Were","Used"],a:1},
 {q:"There ___ be a cinema here, but it closed.",o:["use to","used to","is used to","using to"],a:1},
 {q:"I'm used to ___ in a big city now.",o:["live","living","lived","to live"],a:1},
 {q:"We ___ (used to / live) near the river.",a:["used to live"]},
 {q:"He didn't ___ to study at night.",a:["use"]},
 {q:"Before the master's, I ___ to work as a freelancer.",a:["used"]}]},

{t:"Orações relativas: who, which, that, where, whose",
 ex:`<p>As orações relativas dão informação sobre uma pessoa, coisa ou lugar.</p>
<div class="formula"><b>who</b> → pessoas: the teacher <b>who</b> helped me<br><b>which</b> → coisas: the map <b>which</b> I made<br><b>that</b> → pessoas ou coisas (informal, muito comum)<br><b>where</b> → lugares: the city <b>where</b> I was born<br><b>whose</b> → posse: the student <b>whose</b> project won</div>
<p>Quando a palavra é o objeto do verbo, pode sumir: <i>the book (that) I read</i>. Quando é o sujeito, não pode: <i>the man <b>who</b> lives here</i>.</p>
<p>Com vírgulas, a informação é extra, e não se usa <i>that</i>: <i>Sorocaba, <b>which</b> is near São Paulo, is growing fast.</i></p>`,
 eg:[["She is the professor who supervises my research.","Ela é a professora que orienta minha pesquisa."],["This is the software that I use every day.","Este é o programa que eu uso todo dia."],["Ourinhos is the city where I studied.","Ourinhos é a cidade onde eu estudei."],["I met a woman whose son is a geographer.","Conheci uma mulher cujo filho é geógrafo."]],
 err:["Usar <i>which</i> para pessoas: <i>the man which</i> ✗ → <i>the man who</i> ✓","Repetir o objeto: <i>the map that I made it</i> ✗ → <i>the map that I made</i> ✓"],
 q:[{q:"The woman ___ called you is my aunt.",o:["which","who","where","whose"],a:1},
 {q:"This is the park ___ we did the fieldwork.",o:["who","which","where","whose"],a:2},
 {q:"I lost the pen ___ you gave me.",o:["who","that","where","whose"],a:1},
 {q:"He's the researcher ___ article I read.",o:["who","which","whose","that"],a:2},
 {q:"Brasília, ___ is the capital, was planned.",o:["that","which","where","who"],a:1},
 {q:"The students ___ (who/which) passed got a certificate.",a:["who"]},
 {q:"That's the school ___ I did my internship. (where/which)",a:["where"]},
 {q:"The data ___ we collected was useful. (which/who)",a:["which","that"]}]},

{t:"Voz passiva (presente e passado)",
 ex:`<p>Na <b>voz passiva</b>, o foco está na ação ou no resultado, não em quem fez. É muito usada em textos técnicos e científicos.</p>
<div class="formula"><b>be</b> + <b>particípio</b><br>Presente: The data <b>is collected</b> every month.<br>Passado: The map <b>was made</b> in 2025. · The trees <b>were cut</b> down.<br>Quem fez (opcional): ... <b>by</b> the team.</div>
<p>Compare: <i>The city <b>planted</b> 500 trees</i> (ativa) → <i>500 trees <b>were planted</b> (by the city)</i> (passiva).</p>`,
 eg:[["English is spoken in many countries.","Inglês é falado em muitos países."],["The report was written by our team.","O relatório foi escrito pela nossa equipe."],["The images were processed in Google Earth Engine.","As imagens foram processadas no Google Earth Engine."],["The results are shown in Figure 2.","Os resultados são mostrados na Figura 2."]],
 err:["Esquecer o <i>be</i>: <i>The map made in 2025</i> ✗ → <i>The map was made</i> ✓","Usar o passado em vez do particípio: <i>was wrote</i> ✗ → <i>was written</i> ✓"],
 q:[{q:"The temperature ___ every hour.",o:["measures","is measured","measured","was measure"],a:1},
 {q:"These houses ___ in 1950.",o:["built","were built","was built","are build"],a:1},
 {q:"The book ___ by three authors.",o:["was written","was wrote","written","is write"],a:0},
 {q:"Coffee ___ in Brazil.",o:["grows","is grown","is grow","grown"],a:1},
 {q:"The results ___ in the next chapter.",o:["are presented","presents","is presented","presenting"],a:0},
 {q:"The email ___ (send) yesterday. (was + particípio)",a:["was sent"]},
 {q:"The samples ___ (collect) last week. (were + particípio)",a:["were collected"]},
 {q:"Portuguese ___ (speak) in Brazil.",a:["is spoken"]}]},

{t:"Past perfect (had + particípio)",
 ex:`<p>O <b>past perfect</b> mostra que uma ação aconteceu <b>antes</b> de outra ação no passado. É o \"passado do passado\".</p>
<div class="formula">had + <b>particípio</b><br>When I arrived, the class <b>had</b> already <b>started</b>.<br>(primeiro a aula começou, depois eu cheguei)</div>
<p>Muito usado com <i>when, before, after, by the time, already</i>. Em português costuma ser \"tinha feito\": <i>Eu já tinha saído</i> → <i>I had already left</i>.</p>`,
 eg:[["I had never seen snow before that trip.","Eu nunca tinha visto neve antes daquela viagem."],["When we got to the station, the train had left.","Quando chegamos à estação, o trem tinha saído."],["She had finished the map before the meeting.","Ela tinha terminado o mapa antes da reunião."],["They had already eaten when I called.","Eles já tinham comido quando eu liguei."]],
 err:["Usar past perfect sem uma segunda ação no passado como referência.","<i>had went</i> ✗ → <i>had gone</i> ✓"],
 q:[{q:"When I got home, my sister ___ dinner.",o:["already cooked","had already cooked","has already cooked","cooks"],a:1},
 {q:"I ___ never flown before 2024.",o:["have","had","was","did"],a:1},
 {q:"The film had started when we ___.",o:["arrived","had arrived","arrive","arriving"],a:0},
 {q:"She was tired because she ___ all night.",o:["worked","had worked","has worked","works"],a:1},
 {q:"By the time he called, I ___ to bed.",o:["went","had gone","have gone","go"],a:1},
 {q:"I ___ (not / see) him before that day.",a:["hadn't seen","had not seen"]},
 {q:"They ___ (finish) when I arrived.",a:["had finished"]},
 {q:"We were late. The bus ___ (leave).",a:["had left"]}]},

{t:"Adjetivos -ed × -ing; too e enough",
 ex:`<p>Adjetivos com <b>-ed</b> descrevem como a pessoa <b>se sente</b>. Adjetivos com <b>-ing</b> descrevem o que <b>causa</b> o sentimento.</p>
<div class="formula">I'm <b>bored</b>. (estou entediada) · The film is <b>boring</b>. (o filme é chato)<br>interested / interesting · tired / tiring · excited / exciting · surprised / surprising</div>
<p><b>too</b> + adjetivo = mais do que deveria (problema). <b>adjetivo + enough</b> = suficiente. <b>enough + substantivo</b>.</p>
<div class="formula">It's <b>too</b> hot to work outside.<br>I'm not old <b>enough</b>. · We don't have <b>enough</b> time.</div>`,
 eg:[["I'm interested in climate studies.","Tenho interesse em estudos do clima."],["The fieldwork was tiring.","O trabalho de campo foi cansativo."],["The room is too small for 30 students.","A sala é pequena demais para 30 alunos."],["Is your English good enough for the interview?","Seu inglês é bom o suficiente para a entrevista?"]],
 err:["<i>I'm boring</i> (= eu sou chata!) quando quer dizer <i>I'm bored</i> (estou entediada).","<i>enough good</i> ✗ → <i>good enough</i> ✓"],
 q:[{q:"The lecture was very ___. I almost slept.",o:["bored","boring","bore","bores"],a:1},
 {q:"I was ___ to hear the news.",o:["surprised","surprising","surprise","surprises"],a:0},
 {q:"This coffee is ___ hot to drink.",o:["enough","too","very much","so much"],a:1},
 {q:"She isn't ___ to drive.",o:["enough old","old enough","too old","old too"],a:1},
 {q:"We don't have ___ chairs.",o:["enough","too","too much","enough of"],a:0},
 {q:"The trip was very ___ (excite). Use -ing.",a:["exciting"]},
 {q:"I'm ___ (tire) after work. Use -ed.",a:["tired"]},
 {q:"It's ___ cold to swim. (too/enough)",a:["too"]}]},

{t:"Present perfect continuous (há quanto tempo)",
 ex:`<p>O <b>present perfect continuous</b> destaca uma atividade que começou no passado e <b>continua até agora</b>, ou acabou de parar e deixou marcas.</p>
<div class="formula">have / has + <b>been</b> + verbo<b>-ing</b><br>I <b>have been studying</b> English for two months.<br>How long <b>have</b> you <b>been working</b> on this?<br>It<b>'s been raining</b> all day.</div>
<p>Compare: <i>I've written three chapters</i> (resultado, quantidade) × <i>I've been writing all morning</i> (atividade, duração).</p>`,
 eg:[["I've been learning Python since March.","Estou aprendendo Python desde março."],["She has been teaching for five years.","Ela dá aula há cinco anos."],["Why are you tired? — I've been running.","Por que você está cansada? — Estava correndo."],["How long have you been waiting?","Há quanto tempo você está esperando?"]],
 err:["<i>I'm studying English for two months</i> ✗ → <i>I've been studying English for two months</i> ✓","Verbos de estado não vão para essa forma: <i>I've known her</i>, não <i>I've been knowing</i>."],
 q:[{q:"I ___ for you for an hour!",o:["wait","am waiting","have been waiting","waited"],a:2},
 {q:"How long have you ___ English?",o:["been studying","study","studied being","studying"],a:0},
 {q:"It has been ___ since this morning.",o:["rain","rained","raining","rains"],a:2},
 {q:"She ___ working here since 2024.",o:["is","has been","have been","was"],a:1},
 {q:"I've ___ her for years. (verbo de estado)",o:["been knowing","known","knowing","knew"],a:1},
 {q:"We ___ (work) on this project for three weeks. (have been)",a:["have been working","'ve been working"]},
 {q:"He ___ (play) the guitar since he was ten. (has been)",a:["has been playing","'s been playing"]},
 {q:"How long ___ you been living here?",a:["have"]}]},

{t:"Possibilidade: might, may, could",
 ex:`<p><b>might</b>, <b>may</b> e <b>could</b> indicam que algo é <b>possível</b>, mas não certo.</p>
<div class="formula">It <b>might</b> rain later. (talvez chova)<br>I <b>may</b> go to the conference. (é possível; um pouco mais formal)<br>That <b>could</b> be a problem.<br>Negativa: I <b>might not</b> have time. · She <b>may not</b> come.</div>
<p>Para \"com certeza não\", use <b>can't</b>: <i>That <b>can't</b> be true.</i> Para \"com certeza sim\", use <b>must</b>: <i>She <b>must</b> be tired.</i></p>`,
 eg:[["I might do a PhD next year.","Talvez eu faça doutorado ano que vem."],["The results may change with more data.","Os resultados podem mudar com mais dados."],["You could try a different method.","Você poderia tentar outro método."],["He must be at home. The lights are on.","Ele deve estar em casa. As luzes estão acesas."]],
 err:["<i>I might to go</i> ✗ → <i>I might go</i> ✓","Confundir <i>maybe</i> (advérbio) com <i>may be</i>: <i>Maybe it's true</i> = <i>It may be true</i>."],
 q:[{q:"Take an umbrella. It ___ rain.",o:["might","must","can't","should to"],a:0},
 {q:"I ___ not finish today. It's a lot of work.",o:["may","can","must","will"],a:0},
 {q:"That ___ be Ana. She's in Japan now.",o:["might","can't","must","may"],a:1},
 {q:"You've worked all day. You ___ be exhausted.",o:["can't","must","might not","couldn't"],a:1},
 {q:"We ___ visit Chile in July, but we're not sure.",o:["might","must","can't","have to"],a:0},
 {q:"I ___ (might / not) come to the party.",a:["might not"]},
 {q:"Write one word: ___ it will rain. (talvez, no começo da frase)",a:["maybe"]},
 {q:"The new method ___ give better results. (could)",a:["could"]}]},

{t:"Conectivos: because, so, but, although, however",
 ex:`<p>Conectivos ligam ideias e deixam a fala e a escrita mais claras.</p>
<div class="formula"><b>because</b> → causa: I stayed home <b>because</b> it was raining.<br><b>so</b> → consequência: It was raining, <b>so</b> I stayed home.<br><b>but</b> → contraste simples: It's small <b>but</b> beautiful.<br><b>although</b> → apesar de (+ frase): <b>Although</b> it was late, we continued.<br><b>however</b> → porém (no começo da frase, com vírgula): The data is good. <b>However</b>, the sample is small.<br><b>despite</b> → apesar de (+ substantivo ou -ing): <b>Despite</b> the rain, we went.</div>`,
 eg:[["I'm studying English because I want a better job.","Estou estudando inglês porque quero um emprego melhor."],["The city is hot, so we need more trees.","A cidade é quente, então precisamos de mais árvores."],["Although it's expensive, it's worth it.","Embora seja caro, vale a pena."],["Trees reduce heat. However, they need space.","Árvores reduzem o calor. Porém, precisam de espaço."]],
 err:["<i>Despite it was raining</i> ✗ → <i>Although it was raining</i> ✓ ou <i>Despite the rain</i> ✓","Começar com <i>But</i> em texto formal: prefira <i>However,</i>."],
 q:[{q:"I was tired, ___ I went to bed early.",o:["because","so","although","however"],a:1},
 {q:"She passed ___ she studied a lot.",o:["so","because","but","however"],a:1},
 {q:"___ it was cold, we went to the beach.",o:["Despite","Although","However","So"],a:1},
 {q:"The plan is good. ___, it is expensive.",o:["Because","However","So","Although"],a:1},
 {q:"___ the traffic, we arrived on time.",o:["Although","Despite","However","Because"],a:1},
 {q:"I like maps, ___ I don't like statistics. (but/so)",a:["but"]},
 {q:"It was late, ___ we took a taxi. (so/because)",a:["so"]},
 {q:"We stayed inside ___ it was raining. (because/so)",a:["because"]}]},

{t:"Reported speech (discurso indireto)",
 ex:`<p>Usamos o <b>reported speech</b> para contar o que alguém disse. Normalmente o verbo \"volta\" um tempo.</p>
<div class="formula">\"I <b>am</b> tired.\" → She said (that) she <b>was</b> tired.<br>\"I <b>work</b> here.\" → He said he <b>worked</b> there.<br>\"I <b>will</b> help.\" → She said she <b>would</b> help.<br>\"I <b>saw</b> it.\" → He said he <b>had seen</b> it.<br>\"I <b>can</b> come.\" → She said she <b>could</b> come.</div>
<p><b>say</b> não tem objeto direto; <b>tell</b> precisa de pessoa: <i>She <b>said</b> that...</i> / <i>She <b>told me</b> that...</i></p>
<p>Também mudam palavras de tempo e lugar: <i>today → that day, tomorrow → the next day, here → there</i>.</p>`,
 eg:[["She said she was busy.","Ela disse que estava ocupada."],["He told me he would call.","Ele me disse que ia ligar."],["They said the meeting had finished.","Disseram que a reunião tinha acabado."],["My advisor told me to send the draft.","Minha orientadora me disse para mandar o rascunho."]],
 err:["<i>She said me</i> ✗ → <i>She told me</i> ✓ ou <i>She said to me</i> ✓","<i>He told that</i> ✗ → <i>He said that</i> ✓"],
 q:[{q:"\"I'm hungry.\" → She said she ___ hungry.",o:["is","was","were","be"],a:1},
 {q:"\"I will call you.\" → He said he ___ call me.",o:["will","would","can","is"],a:1},
 {q:"She ___ me that she was leaving.",o:["said","told","say","talked"],a:1},
 {q:"He ___ that he was tired.",o:["told","said","told me to","talked"],a:1},
 {q:"\"I can swim.\" → She said she ___ swim.",o:["can","could","can to","would can"],a:1},
 {q:"\"I live in Sorocaba.\" → She said she ___ in Sorocaba.",a:["lived"]},
 {q:"\"We finished.\" → They said they ___ finished. (had)",a:["had"]},
 {q:"The teacher told us ___ (open) our books. (to + verbo)",a:["to open"]}]},

{t:"Perguntas indiretas e educadas",
 ex:`<p>Perguntas indiretas são mais educadas e muito usadas em entrevistas, e-mails e atendimento. Depois da introdução, a ordem volta a ser a de uma frase afirmativa (sujeito + verbo), sem do/does/did.</p>
<div class="formula">Where <b>is</b> the station? → Could you tell me where the station <b>is</b>?<br>What time <b>does</b> it start? → Do you know what time it <b>starts</b>?<br>Perguntas de sim/não usam <b>if</b> ou <b>whether</b>:<br><b>Is</b> she coming? → I wonder <b>if</b> she <b>is</b> coming.</div>
<p>Introduções úteis: <i>Could you tell me..., Do you know..., I'd like to know..., I was wondering if...</i></p>`,
 eg:[["Could you tell me where the library is?","Você poderia me dizer onde fica a biblioteca?"],["Do you know when the deadline is?","Você sabe quando é o prazo?"],["I'd like to know how the data was collected.","Gostaria de saber como os dados foram coletados."],["I was wondering if you could help me.","Eu queria saber se você poderia me ajudar."]],
 err:["<i>Could you tell me where is the station?</i> ✗ → <i>where the station is</i> ✓","<i>Do you know what time does it start?</i> ✗ → <i>what time it starts</i> ✓"],
 q:[{q:"Could you tell me where ___?",o:["is the bank","the bank is","does the bank","is bank"],a:1},
 {q:"Do you know what time ___?",o:["does the class start","the class starts","starts the class","the class does start"],a:1},
 {q:"I wonder ___ she will come.",o:["that","if","what","does"],a:1},
 {q:"Can you tell me how much ___?",o:["does it cost","it costs","costs it","is it cost"],a:1},
 {q:"I'd like to know why ___ late.",o:["were you","you were","did you","you did"],a:1},
 {q:"Where is the office? → Could you tell me where the office ___?",a:["is"]},
 {q:"Did he call? → Do you know ___ he called? (if/that)",a:["if","whether"]},
 {q:"How old is she? → Do you know how old she ___?",a:["is"]}]},

{t:"Phrasal verbs comuns",
 ex:`<p><b>Phrasal verbs</b> são verbos + partícula (up, out, on, off...) com um sentido próprio. São muito usados na fala.</p>
<div class="formula">look for → procurar · look up → pesquisar (no dicionário)<br>find out → descobrir · figure out → entender, resolver<br>give up → desistir · keep up (with) → acompanhar, manter o ritmo<br>carry out → realizar (pesquisa, estudo) · set up → montar, configurar<br>turn on / off → ligar / desligar · put off → adiar<br>come up with → ter uma ideia · run out of → ficar sem</div>
<p>Alguns aceitam o objeto no meio: <i>turn <b>the light</b> off</i> ou <i>turn off the light</i>. Com pronome, ele fica no meio: <i>turn <b>it</b> off</i>.</p>`,
 eg:[["I'm looking for a job in GIS.","Estou procurando emprego em SIG."],["Don't give up! You're improving.","Não desista! Você está melhorando."],["We carried out a field survey.","Realizamos um levantamento de campo."],["We ran out of time.","Ficamos sem tempo."]],
 err:["<i>turn off it</i> ✗ → <i>turn it off</i> ✓","Traduzir ao pé da letra: <i>give up</i> não é \"dar para cima\"."],
 q:[{q:"I'm ___ my keys. Have you seen them?",o:["looking for","looking up","finding out","giving up"],a:0},
 {q:"Learning English is hard, but don't ___.",o:["give up","set up","find out","put off"],a:0},
 {q:"We ___ an experiment in the lab.",o:["carried out","ran out","gave up","turned off"],a:0},
 {q:"Can you ___ the projector, please?",o:["turn on","look for","give up","carry out"],a:0},
 {q:"She ___ a great idea for the project.",o:["came up with","ran out of","looked up","put off"],a:0},
 {q:"We have no more coffee. We ___ out of coffee. (passado de run)",a:["ran"]},
 {q:"Look the word ___ in the dictionary. (up/out)",a:["up"]},
 {q:"I want to find ___ more about the course. (out/up)",a:["out"]}]},

{t:"Revisão: tempos verbais",
 ex:`<p>Revisão de tudo o que você estudou sobre tempos verbais:</p>
<div class="formula"><b>Present simple</b> → rotina: I <b>work</b> every day.<br><b>Present continuous</b> → agora: I<b>'m working</b> now.<br><b>Past simple</b> → passado terminado: I <b>worked</b> yesterday.<br><b>Past continuous</b> → em andamento no passado: I <b>was working</b> when...<br><b>Present perfect</b> → experiência / até agora: I<b>'ve worked</b> here since 2025.<br><b>Present perfect continuous</b> → duração até agora: I<b>'ve been working</b> all day.<br><b>Past perfect</b> → antes de outro passado: I <b>had worked</b> before I...<br><b>Futuro</b> → I<b>'m going to</b> work / I<b>'ll</b> work / I<b>'m working</b> tomorrow.<br><b>used to</b> → hábito antigo: I <b>used to</b> work there.</div>`,
 eg:[["I've lived here since 2025, but I used to live in Ourinhos.","Moro aqui desde 2025, mas morava em Ourinhos."],["I was writing when my advisor called.","Eu estava escrevendo quando minha orientadora ligou."],["I'm going to defend my dissertation in December.","Vou defender minha dissertação em dezembro."],["Before the master's, I had never used Python.","Antes do mestrado, eu nunca tinha usado Python."]],
 err:["Volte às aulas das semanas 1, 4, 5, 9 e 10 se errar mais de 2 questões deste bloco."],
 q:[{q:"I ___ English for three months now.",o:["study","am studying","have been studying","studied"],a:2},
 {q:"Yesterday I ___ a great video.",o:["have watched","watched","was watch","watch"],a:1},
 {q:"She usually ___ to work by bus.",o:["goes","is going","went","has gone"],a:0},
 {q:"When I arrived, they ___ dinner.",o:["had","were having","have","are having"],a:1},
 {q:"I ___ to Chile twice.",o:["went","have been","was","had gone"],a:1},
 {q:"I ___ visit my parents next weekend. (plano)",o:["am going to","will to","go to","have"],a:0},
 {q:"We ___ (used to) play in the street when we were kids.",a:["used to"]},
 {q:"By 2020 I ___ (already / finish) school. (had)",a:["had already finished"]}]},

{t:"Revisão: condicionais, passiva e conectivos",
 ex:`<p>Revisão das estruturas mais usadas para argumentar e escrever textos:</p>
<div class="formula"><b>1ª condicional</b>: If it <b>rains</b>, we <b>will</b> stay.<br><b>2ª condicional</b>: If I <b>had</b> time, I <b>would</b> travel.<br><b>Passiva</b>: The data <b>was collected</b> in 2025.<br><b>Relativas</b>: the city <b>where</b> I live · the method <b>which</b> we used<br><b>Gerúndio/infinitivo</b>: I enjoy <b>reading</b> · I want <b>to read</b><br><b>Conectivos</b>: because, so, although, however, despite<br><b>Modais</b>: should (conselho), might (possibilidade), must (obrigação/dedução)</div>`,
 eg:[["If we planted more trees, the city would be cooler.","Se plantássemos mais árvores, a cidade seria mais fresca."],["The images were classified using machine learning.","As imagens foram classificadas usando aprendizado de máquina."],["Although the sample was small, the results were clear.","Embora a amostra fosse pequena, os resultados foram claros."],["You should practise speaking every day.","Você deveria praticar a fala todo dia."]],
 err:["Volte às aulas das semanas 6, 7, 8 e 11 se errar mais de 2 questões deste bloco."],
 q:[{q:"If I ___ you, I would accept.",o:["am","was being","were","will be"],a:2},
 {q:"If it ___ tomorrow, we'll cancel the trip.",o:["will rain","rains","rained","would rain"],a:1},
 {q:"The report ___ last week.",o:["finished","was finished","has finish","is finishing"],a:1},
 {q:"That's the professor ___ helped me.",o:["which","who","where","whose"],a:1},
 {q:"I'm interested in ___ abroad.",o:["study","to study","studying","studied"],a:2},
 {q:"___ the rain, the fieldwork went well.",o:["Although","Despite","However","Because"],a:1},
 {q:"You look tired. You ___ rest. (conselho)",a:["should"]},
 {q:"The trees ___ (plant) in 2020. (were + particípio)",a:["were planted"]}]}
];

R:{t:"Why trees matter in cities",text:"Trees do much more than make a street beautiful. In a hot city, a single large tree can lower the temperature around it by several degrees.\n\nTrees help in two ways. First, they give shade, so the sun does not heat the ground and the walls of buildings. Second, they release water through their leaves. This process, called evapotranspiration, cools the air.\n\nTrees also reduce floods, because their roots help the soil absorb rain. They clean the air and give homes to birds and insects.\n\nHowever, planting trees in cities is not easy. Some streets are too narrow, and roots can damage pavements and pipes. That is why urban planners need to choose the right species for each place and take care of the trees after they are planted.",
q:[{q:"How can a large tree affect temperature?",o:["It makes it hotter","It can lower it by several degrees","It has no effect","It only works at night"],a:1},

conv:["What is the weather like in your city?","What environmental problems does your region have?","Have you ever experienced a heat wave or a flood?","Why are cities hotter than the countryside?","What should the government do?","What do you do to help the environment?"]},

R:{t:"Five tips for a job interview in English",text:"A job interview in a foreign language can be stressful, but good preparation makes a big difference.\n\nFirst, prepare your answers to common questions, such as \"Tell me about yourself\" and \"What are your strengths?\". Practise them out loud, but don't memorise every word.\n\nSecond, prepare examples. Instead of saying \"I'm organised\", tell a short story about a project you organised and what happened.\n\nThird, learn the vocabulary of your area. If you work with maps, you should know words like layer, dataset, accuracy and land use.\n\nFourth, it is fine to ask the interviewer to repeat a question. You can say: \"Sorry, could you repeat that, please?\"\n\nFinally, prepare one or two questions for the end. This shows that you are interested in the company.",

R:{t:"A short history of GIS",text:"A Geographic Information System, or GIS, is a tool that stores, analyses and shows data about places. Today it is used in agriculture, transport, health, planning and many other areas.\n\nThe first modern GIS was created in Canada in the 1960s. The government wanted to make an inventory of its land, and the work was too big to do by hand. At that time, computers were huge and very expensive.\n\nIn the 1980s and 1990s, personal computers became popular, and GIS software started to be used by universities and companies. In the 2000s, free satellite images and open-source programs, such as QGIS, made GIS available to almost everyone.\n\nToday, with cloud platforms like Google Earth Engine, a student with a laptop can analyse decades of satellite images in a few minutes.",
q:[{q:"Where was the first modern GIS created?",o:["In the United States","In Brazil","In Canada","In Japan"],a:2},
{q:"Why was it created?",o:["To make games","To make an inventory of land","To study the ocean","To sell computers"],a:1},
{q:"What happened in the 2000s?",o:["GIS was forgotten","Free images and open-source programs appeared","Computers became more expensive","Satellites stopped working"],a:1},
{q:"What can a student do today with Google Earth Engine?",o:["Nothing without a big computer","Analyse decades of images in minutes","Only see maps","Build satellites"],a:1}],
g:[["to store","armazenar"],["inventory","inventário, levantamento"],["by hand","à mão"],["huge","enorme"],["open-source","código aberto"],["decade","década"]]},
S:{ph:[["Basically, it's a tool that...","Basicamente, é uma ferramenta que..."],["First,... then,... finally,...","Primeiro,... depois,... por fim,..."],["It's used for things like...","É usado para coisas como..."],["Imagine a map with layers.","Imagine um mapa com camadas."],["For example, you can see where...","Por exemplo, você pode ver onde..."],["Does that make sense?","Faz sentido?"]],
model:"GIS stands for Geographic Information System. Basically, it's a tool that helps us analyse information about places. Imagine a map with layers. One layer shows the streets, another shows the rivers and another shows the temperature. When you put the layers together, you can see patterns. For example, you can see where the hottest areas of a city are and whether they have trees. It's used for things like urban planning, agriculture and health. Does that make sense?",
conv:["What technology do you use every day?","How would you explain GIS to a child?","When did you first use a GIS program?","What were you doing when you learned Google Earth Engine?","What is the most useful app on your phone?","Do you think technology helps the environment?"]},
W:{check:["Explique um processo em passos (First, Then, After that, Finally).","Use verbos no imperativo ou no present simple.","Mencione o resultado final.","Entre 70 e 110 palavras."],
model:"This is how I map land surface temperature in Google Earth Engine. First, I choose the study area and the dates. Then, I select Landsat images with few clouds. After that, I convert the thermal band into temperature in degrees Celsius. Next, I calculate the average temperature for the summer months. Finally, I export the result and create a map in QGIS, using a colour scale from blue to red. The final map shows clearly which neighbourhoods are the hottest and helps planners decide where to plant trees."}},

R:{t:"Active learning in the classroom",text:"For a long time, the typical class was simple: the teacher talked and the students listened and took notes. Today, many teachers prefer active learning, where students do something instead of only listening.\n\nIn an active class, students might solve a problem in groups, play an educational game, create a map or discuss a real situation from their city. The teacher still explains the main ideas, but the class is more like a workshop.\n\nResearch shows that students who learn actively usually remember more and fail less. They also develop skills like teamwork and communication.\n\nHowever, active learning needs good planning. Activities take more time, classrooms are often crowded and some students are shy. A good teacher balances short explanations with activities and gives clear instructions.",

R:{t:"Festa Junina",text:"Every June and July, schools, churches and towns all over Brazil celebrate the Festa Junina. The festival has European origins, but it was mixed with rural Brazilian traditions over the centuries.\n\nPeople wear checked shirts and straw hats, and they decorate the streets with small coloured flags. There is a big bonfire, and everyone eats typical food made from corn and peanuts, such as pamonha, corn cake and pé-de-moleque. Adults drink quentão, a hot drink with ginger and spices.\n\nThe most famous part of the festival is the quadrilha, a dance in pairs inspired by French country dances. A caller shouts instructions, and the dancers move in lines and circles.\n\nIn some cities in the Northeast, such as Campina Grande and Caruaru, the celebrations are enormous and attract more than a million visitors.",

R:{t:"Why most resolutions fail",text:"Every January, millions of people decide to exercise more, eat better or learn a language. By February, most of them have already given up. Why does this happen?\n\nOne reason is that the goals are too big and too vague. \"I'm going to get fit\" is not a plan. \"I'm going to walk for 30 minutes on Monday, Wednesday and Friday\" is much better.\n\nAnother reason is motivation. Motivation is strong at the beginning, but it disappears quickly. Habits are more reliable. If you study at the same time and in the same place every day, it becomes automatic.\n\nExperts also suggest tracking your progress and celebrating small victories. Finally, don't stop after one bad day. Missing one day is normal. The important thing is not to miss two days in a row.",

R:{t:"How to write a good abstract",text:"The abstract is the first part of a scientific paper that people read, and often the only one. That is why it should be clear, short and complete.\n\nMost abstracts follow the same structure. First, they present the context and the problem. Then, they state the objective of the study. After that, they briefly describe the methods: what data was used and how it was analysed. Next, they present the main results, if possible with numbers. Finally, they explain why the results are important.\n\nGood abstracts avoid long introductions, references and abbreviations that are not explained. They usually use the past tense for methods and results (\"we analysed\", \"the results showed\") and the present tense for general facts and conclusions (\"urban heat is a growing problem\").\n\nMost journals ask for abstracts of 150 to 250 words.",
q:[{q:"Why is the abstract important?",o:["It is the longest part","It is often the only part people read","It has all the references","It is optional"],a:1},
{q:"What comes after the objective?",o:["The references","The methods","The title","The acknowledgements"],a:1},
{q:"Which tense is used for methods and results?",o:["Future","Past","Present continuous","Conditional"],a:1},
{q:"How long is a typical abstract?",o:["50 words","150 to 250 words","500 words","Two pages"],a:1}],

model:"My research focuses on urban heat islands in Sorocaba. The main objective is to identify the hottest areas of the city and understand why they are hotter. We used ten years of Landsat images and a machine learning model to classify the areas. The results show that neighbourhoods with few trees can be several degrees hotter than green areas. This is important because heat affects people's health, and the city can use these maps to decide where to plant trees.",
conv:["What is your research about?","Why did you choose this topic?","What data did you use?","What were the main results?","What was the most difficult part?","What are the next steps?"]},
W:{check:["Siga a ordem: contexto, objetivo, métodos, resultados, importância.","Use past simple e voz passiva nos métodos (were analysed).","Use present simple nas conclusões.","Entre 120 e 170 palavras."],
model:"Urban heat islands are a growing problem in Brazilian cities, especially in neighbourhoods with little vegetation. This study aimed to identify and classify the urban heat islands of Sorocaba, São Paulo, Brazil. Land surface temperature was estimated from Landsat 8 and 9 images acquired in the summers of 2015 to 2025 and processed in Google Earth Engine. A random forest model was trained with land cover, vegetation index and building density data to classify the intensity of the heat islands. The results showed that the hottest areas were up to 7 °C warmer than the green areas and were concentrated in dense neighbourhoods with few trees. The model reached an accuracy of 89%. These findings can help local planners prioritise areas for tree planting and other cooling strategies."}},

/* ---------- aulas: navegação ---------- */
let EST=null,aWeek=null;
function openGo(go){
 const m=/^([glrsw]):(\d+)$/.exec(go);
 if(m){EST={k:m[1],i:+m[2]};if(location.hash==='#estudo')render();else location.hash='estudo';window.scrollTo(0,0);return}
 location.hash=go;
}
function enVoices(){try{return speechSynthesis.getVoices().filter(x=>/^en[-_]/i.test(x.lang))}catch(e){return[]}}
function sayLines(lines,rate){try{speechSynthesis.cancel();const vs=enVoices();const names=[...new Set(lines.map(l=>l[0]))];
 lines.forEach(l=>{const u=new SpeechSynthesisUtterance(l[1]);u.lang='en-US';u.rate=rate||.95;
  if(vs.length){const k=names.indexOf(l[0]);u.voice=vs[k%vs.length]}speechSynthesis.speak(u)})}catch(e){}}
function stopSay(){try{speechSynthesis.cancel()}catch(e){}}
function normA(s){return String(s).toLowerCase().replace(/[’`]/g,"'").replace(/[.!?]+$/,'').replace(/\s+/g,' ').trim()}
function mcBlock(qs,store,key){
 return qs.map((q,i)=>`<div class="gbody exq" data-q="${i}"><p lang="en"><b>${i+1}.</b> ${esc(q.q)}</p><div class="opts">${q.o.map((o,k)=>`<button type="button" class="opt" data-k="${k}" lang="en"><kbd>${'ABCD'[k]}</kbd><span>${esc(o)}</span></button>`).join('')}</div></div>`).join('');
}
function wireMC(root,qs,ans,onDone){
 root.querySelectorAll('.exq').forEach(box=>{const i=+box.dataset.q,q=qs[i];if(!q.o)return;
  const mark=k=>{box.querySelectorAll('.opt').forEach(o=>{const kk=+o.dataset.k;o.disabled=true;if(kk===q.a)o.classList.add('right');else if(kk===k)o.classList.add('wrong')})};
  if(ans[i]!=null)mark(ans[i]);
  box.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{ans[i]=+o.dataset.k;mark(ans[i]);onDone&&onDone()})});
}

/* ---------- aba Aulas ---------- */
function vAulas(v){
 if(aWeek===null)aWeek=curWeek();
 S.gram=S.gram||{};S.seen=S.seen||{};
 const ws=document.createElement('div');ws.className='weeks';ws.setAttribute('role','group');ws.setAttribute('aria-label','Semanas');
 for(let w=0;w<13;w++){const s=addDays(START,w*7);const b=document.createElement('button');b.type='button';b.className='wk';b.setAttribute('aria-pressed',w===aWeek);
  const n=['g:'+w*2,'g:'+(w*2+1),'l:'+w,'r:'+w,'s:'+w,'w:'+w].filter(isDone).length;
  b.innerHTML=`<b>S${w+1}</b><span>${s.getDate()} ${MON[s.getMonth()]}</span><span class="pbar"><i style="width:${n/6*100}%"></i></span>`;
  b.onclick=()=>{aWeek=w;render()};ws.appendChild(b)}
 v.appendChild(ws);
 const W=WK[aWeek];const hd=document.createElement('div');hd.className='weekhead';
 hd.innerHTML=`<div class="eyebrow">Semana ${aWeek+1} · ${fmt(addDays(START,aWeek*7))} a ${fmt(addDays(START,aWeek*7+5))}</div><h2>${esc(WEEKS[aWeek].th)}</h2><p class="empty">Todo o conteúdo da semana. O plano da aba Hoje diz em que dia usar cada parte.</p>`;
 v.appendChild(hd);
 const items=[
  ['g:'+aWeek*2,'Gramática','Aula de segunda',GRAM[aWeek*2].t],
  ['g:'+(aWeek*2+1),'Gramática','Aula de quinta',GRAM[aWeek*2+1].t],
  ['l:'+aWeek,'Escuta','Escuta (segunda) e shadowing (quarta)',W.L.t],
  ['r:'+aWeek,'Leitura','Leitura de terça',W.R.t],
  ['s:'+aWeek,'Fala','Fala: monólogo e roteiro de conversa',WEEKS[aWeek].sp],
  ['w:'+aWeek,'Escrita','Escrita de quinta',WEEKS[aWeek].wr.charAt(0).toUpperCase()+WEEKS[aWeek].wr.slice(1)],
 ];
 const g=document.createElement('div');g.className='games';
 g.innerHTML=items.map(it=>`<button type="button" class="gcard" data-go="${it[0]}"><span class="sk" style="--c:var(${SKC[it[1]]})">${it[2]}</span><b lang="${it[0][0]==='g'||it[0][0]==='w'?'pt':'en'}">${esc(it[3])}</b><small>${doneLabel(it[0])}</small></button>`).join('');
 g.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openGo(b.dataset.go));

function isDone(id){const [k,i]=id.split(':');if(k==='g')return S.gram&&S.gram[i]!=null;return !!(S.seen&&S.seen[id])}
function doneLabel(id){const [k,i]=id.split(':');if(k==='g'&&S.gram&&S.gram[i]!=null)return `✓ Feita · melhor nota ${S.gram[i]}/8`;return isDone(id)?'✓ Feita':'Ainda não feita'}
function markSeen(id){S.seen=S.seen||{};if(!S.seen[id]){S.seen[id]=today();save()}}

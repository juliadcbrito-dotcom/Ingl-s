.end{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.clock{font-family:var(--f-mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.txt{font:inherit;font-size:17px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function curWeek(){const n=new Date();n.setHours(0,0,0,0);return Math.min(12,Math.max(0,Math.floor(Math.round((n-START)/864e5)/7)))}
function vocabFor(w){return w===12?VOCAB.flat():VOCAB[w]}
function gs(){S.games=S.games||{best:{},xp:0,played:0};return S.games}
function addXP(n){const g=gs();g.xp+=n;g.played++;save()}

 pares:{name:'Pares',skill:'Vocabulário',desc:'Jogo da memória: encontre cada palavra em inglês e o seu significado.',best:g=>g.best.pares?`Recorde: ${g.best.pares} jogadas`:'Ainda sem recorde',

 frase:{name:'Monte a frase',skill:'Gramática',desc:'Toque nas palavras embaralhadas na ordem certa. 5 frases do seu nível.',best:g=>g.best.frase!=null?`Recorde: ${g.best.frase} de 5`:'Ainda sem recorde',

 corrida:{name:'Contra o relógio',skill:'Gramática',desc:'60 segundos de perguntas rápidas: lacunas de gramática e vocabulário do tema. Erro custa 3 segundos.',best:g=>g.best.corrida!=null?`Recorde: ${g.best.corrida} pontos`:'Ainda sem recorde',

     const p=voc[Math.floor(Math.random()*voc.length)];const opts=shuffle([p,...shuffle(voc.filter(z=>z!==p)).slice(0,3)]);return{q:`What does “${esc(p[0])}” mean?`,o:opts.map(z=>z[1]),a:opts.indexOf(p)}}
    function draw(){cur=make();b.innerHTML=`<div class="row" style="justify-content:space-between"><span class="clock" id="ck">${left}s</span><span class="clock">${score} pts</span></div>

     b.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{if(+o.dataset.v===cur.a){score++;draw();b.querySelector('.qtext').classList.add('flash-ok')}else{wrong++;left=Math.max(0,left-3);o.classList.add('flash-no');o.disabled=true;upd()}})}

    function end(){clearInterval(GT);const g=gs();const rec=g.best.corrida==null||score>g.best.corrida;if(rec)g.best.corrida=score;addXP(score);b.innerHTML='';
     finishGame(b,`${score} pontos${rec?' — novo recorde!':''} (+${score} XP)`,`<p class="empty">${wrong} erro${wrong===1?'':'s'}.</p>`)}
    draw();GT=setInterval(()=>{left--;upd()},1000)}}},
 ditado:{name:'Ditado',skill:'Escuta',desc:'Ouça a frase lida em voz alta e escreva o que entendeu. Dá para ouvir devagar.',best:g=>g.best.ditado!=null?`Recorde: ${g.best.ditado}% de acerto`:'Ainda sem recorde',
  run(v){const b=shell(v,'Ditado','Escuta');

    const vs=speechSynthesis.getVoices().filter(x=>/^en[-_]/i.test(x.lang));if(vs.length)u.voice=vs.find(x=>/en[-_]US/i.test(x.lang))||vs[0];speechSynthesis.speak(u)}catch(e){}}
   function round(){b.innerHTML=`<p class="qmeta"><span>Frase ${r+1} de 5</span><span>Média: ${r?Math.round(tot/r):0}%</span></p>
    <div class="row"><button class="btn" id="pl" type="button">▶ Ouvir</button><button class="btn ghost" id="sl" type="button">Ouvir devagar</button></div>
    <label for="dit" class="empty">Escreva o que ouviu (pontuação não conta):</label><input class="txt" id="dit" lang="en" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row"><button class="btn small" id="ok" type="button">Conferir</button></div><div id="fb"></div>`;
    b.querySelector('#pl').onclick=()=>speak(.95);b.querySelector('#sl').onclick=()=>speak(.6);

    b.querySelector('#ok').onclick=()=>{const tgt=norm(list[r]);const got=norm(inp.value);const bag={};got.forEach(w=>bag[w]=(bag[w]||0)+1);let hit=0;

     const pct=Math.round(hit/tgt.length*100);tot+=pct;inp.disabled=true;b.querySelector('#ok').disabled=true;
     b.querySelector('#fb').innerHTML=`<p class="${pct>=80?'good':'badt'}">${pct}% das palavras</p><p lang="en" style="font-size:18px">${marked}</p><button class="btn small" id="nx" type="button" style="margin-top:8px">${r<4?'Próxima frase':'Ver resultado'}</button>`;
     b.querySelector('#nx').onclick=()=>{r++;if(r<5)round();else{const avg=Math.round(tot/5);const g=gs();g.best.ditado=Math.max(g.best.ditado||0,avg);addXP(Math.round(avg/10));b.innerHTML='';
      finishGame(b,`Média de ${avg}% de acerto. (+${Math.round(avg/10)} XP)`,'<p class="empty">Palavras em vermelho e sublinhadas são as que faltaram ou ficaram diferentes.</p>')}}};
    inp.focus({preventScroll:true})}

};

/* ---------- praticar ---------- */
let SAMPLE, AI_OFF=false, waitingSample=false, convCtl=null, FQ=null;
const SAMPLE_P=(async()=>{try{return (window.claude&&window.claude.use)?await window.claude.use('sample'):null}catch(e){return null}})();
SAMPLE_P.then(x=>{SAMPLE=x;if(waitingSample)render()});
function today(){return iso(new Date())}
function say(text,rate){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate||.95;
 const vs=speechSynthesis.getVoices().filter(x=>/^en[-_]/i.test(x.lang));if(vs.length)u.voice=vs.find(x=>/en[-_]US/i.test(x.lang))||vs[0];speechSynthesis.speak(u)}catch(e){}}
const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
function normW(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean).map(w=>/^\d+$/.test(w)&&+w<=12?NUMW[+w]:w)}
function compareSpoken(target,heard){const t=normW(target);const bag={};normW(heard).forEach(w=>bag[w]=(bag[w]||0)+1);let hit=0;
 const html=target.split(' ').map(w=>{const n=normW(w)[0];if(n&&bag[n]>0){bag[n]--;hit++;return`<span class="w-ok">${esc(w)}</span>`}return`<span class="w-miss">${esc(w)}</span>`}).join(' ');
 return{pct:Math.round(hit/Math.max(1,t.length)*100),html}}
function noAI(){return `<p class="note">Esta ferramenta usa o Claude${AI_OFF?', e o uso do Claude não foi autorizado nesta página':''}. Ela funciona quando o app é aberto dentro do Claude, pelo link do artifact. Na versão publicada em outro endereço, use Flashcards, Leitura (textos já gerados), Pronúncia e Jogos.</p>`}
function aiGate(b){if(SAMPLE===undefined){b.innerHTML='<p class="empty">Conectando ao Claude…</p>';waitingSample=true;return false}
 if(!SAMPLE||AI_OFF){b.innerHTML=noAI();return false}return true}
function handleErr(e,el){const code=e&&e.code;
 if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){AI_OFF=true;el.innerHTML=noAI();return}
 const m={rate_limited:'Muitos pedidos seguidos ou limite de uso do Claude atingido. Espere um pouco e tente de novo.',session_expired:'Sua sessão no Claude expirou. Entre de novo e tente outra vez.',invalid_json:'A resposta veio num formato inesperado. Tente de novo.',refused:'O Claude não respondeu a esse pedido. Mude o texto e tente de novo.',empty_completion:'O Claude não devolveu nada. Tente de novo.'}[code]||'A conexão com o Claude falhou. Tente de novo.';
 el.innerHTML=`<p class="badt">${m}</p>`}
function pshell(v,title,skill,sub){
 v.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><a class="btn ghost small" href="#praticar" style="text-decoration:none">← Praticar</a><span class="sk" style="--c:var(${SKC[skill]})">${skill}</span></div><h2>${title}</h2>${sub?`<p class="empty">${sub}</p>`:''}<div class="gbody" id="pbody"></div></div>`;
 return v.querySelector('#pbody')}
function addCards(list){S.custom=S.custom||[];let n=0;list.forEach(c=>{const en=String(c.en||'').trim(),pt=String(c.pt||'').trim();if(en&&pt&&!S.custom.some(x=>x.en===en)){S.custom.push({en,pt});n++}});FQ=null;save();return n}

/* flashcards */
const IV=[1,2,4,7,15,30];
function dueCards(){const t=today();S.srs=S.srs||{};const out=[];
 (S.custom||[]).forEach(c=>out.push({id:'c:'+c.en,en:c.en,pt:c.pt}));
 const uw=Math.min(11,curWeek());for(let w=0;w<=uw;w++)VOCAB[w].forEach(p=>out.push({id:'v:'+p[0],en:p[0],pt:p[1]}));
 const used=S.newDay===t?(S.newCount||0):0;
 return{all:out,due:out.filter(c=>S.srs[c.id]&&S.srs[c.id].due<=t),fresh:out.filter(c=>!S.srs[c.id]).slice(0,Math.max(0,10-used))}}
function vFlash(v){
 const b=pshell(v,'Flashcards','Vocabulário','Errou: volta hoje. Difícil: volta amanhã. Acertou: volta em 2, 4, 7, 15 e depois 30 dias. Até 10 cartões novos por dia.');
 b.innerHTML='<div id="sess" class="gbody"></div>';const sess=b.querySelector('#sess');
 const f=document.createElement('form');f.className='addf';
 f.innerHTML=`<h3>Criar cartão</h3><div class="two"><input class="txt" id="fen" lang="en" placeholder="Em inglês (de preferência uma frase)" required><input class="txt" id="fpt" placeholder="Significado em português" required></div><div class="row"><button class="btn small" type="submit">Adicionar</button><span class="empty" id="fmsg"></span></div>`;
 f.onsubmit=e=>{e.preventDefault();const n=addCards([{en:f.querySelector('#fen').value,pt:f.querySelector('#fpt').value}]);f.reset();f.querySelector('#fmsg').textContent=n?'Cartão criado. Ele aparece na próxima rodada.':'Esse cartão já existe.'};
 b.appendChild(f);
 if(!FQ){const d=dueCards();FQ=shuffle(d.due).concat(d.fresh)}
 function show(){
  if(!FQ.length){const d=dueCards();const fixed=Object.values(S.srs||{}).filter(e=>e.box>=3).length;
   sess.innerHTML=`<p class="good">Revisão do dia concluída.</p><p class="empty">${d.all.length} cartões liberados até agora · ${fixed} bem fixados.</p>`;return}
  const c=FQ[0];const isNew=!(S.srs&&S.srs[c.id]);
  sess.innerHTML=`<p class="qmeta"><span>${FQ.length} para hoje</span><span>${isNew?'Novo':'Revisão'}</span></p>
   <div class="fcard"><p class="fen" lang="en">${esc(c.en)}</p><p class="fpt" id="back" hidden>${esc(c.pt)}</p></div>
   <div class="row" id="act"><button class="btn ghost" id="hear" type="button">▶ Ouvir</button><button class="btn" id="rev" type="button">Mostrar resposta</button></div>`;
  sess.querySelector('#hear').onclick=()=>say(c.en.replace(/^Corrija: /,''),.9);
  sess.querySelector('#rev').onclick=()=>{sess.querySelector('#back').hidden=false;
   sess.querySelector('#act').innerHTML='<button class="btn ghost" type="button" data-g="0">Errei</button><button class="btn ghost" type="button" data-g="1">Difícil</button><button class="btn" type="button" data-g="2">Acertei</button>';
   sess.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>grade(c,+x.dataset.g))}}
 function grade(c,g){const t=today();S.srs=S.srs||{};const e=S.srs[c.id]||{box:0};
  if(!S.srs[c.id]){if(S.newDay!==t){S.newDay=t;S.newCount=0}S.newCount++}
  FQ.shift();
  if(g===0){e.box=0;e.due=t;FQ.push(c)}else if(g===1){e.due=iso(addDays(new Date(),1))}else{e.box=Math.min(5,e.box+1);e.due=iso(addDays(new Date(),IV[e.box]))}
  S.srs[c.id]=e;save();show()}
 show();
}

 if(WR)renderWR(out);
 b.querySelector('#wgo').onclick=async e=>{const txt=ta.value.trim();
  if((txt.match(/\S+/g)||[]).length<8){out.innerHTML='<p class="badt">Escreva pelo menos duas ou três frases antes de corrigir.</p>';return}
  const btn=e.currentTarget;btn.disabled=true;out.innerHTML='<p class="empty">Corrigindo… pode levar até um minuto.</p>';
  const prompt=`You are an English teacher for a Brazilian adult learner at CEFR A2 whose goal is B1. Correct the learner's text below.
Task the learner was given (in Portuguese): "${task}".
Reply with only JSON in this shape:
{"corrected": "the full text corrected, keeping the learner's ideas and voice", "score": 0-10 integer, "level": "A1"|"A2"|"B1"|"B2", "errors": [{"original": "the wrong excerpt", "fix": "the corrected excerpt", "why": "short explanation in Brazilian Portuguese"}], "good": "one thing done well, in Brazilian Portuguese", "tip": "one concrete tip for the next text, in Brazilian Portuguese"}
List at most 8 errors, the most important first. Ignore stylistic preferences that are not mistakes.
Learner's text:
"""
${txt.slice(0,6000)}
"""`;
  try{const r=await SAMPLE.json(prompt,{cache:false});if(!r||typeof r!=='object')throw{code:'invalid_json'};WR=r;S.writings=S.writings||[];S.writings.push({date:today(),score:Number(r.score)||0});save();renderWR(out)}
  catch(err){handleErr(err,out)}finally{btn.disabled=false}};
}
function renderWR(out){const r=WR;const errs=Array.isArray(r.errors)?r.errors:[];
 out.innerHTML=`<div class="end"><div class="row"><span class="clock">${Number(r.score)||0}/10</span><span class="tag">Nível do texto: ${esc(r.level||'?')}</span></div>
 ${r.good?`<p><b>Ponto forte:</b> ${esc(r.good)}</p>`:''}
 <h3>Correções</h3>${errs.length?`<ul class="list">${errs.map(x=>`<li><span class="w-miss" lang="en">${esc(x.original)}</span> → <b class="w-ok" lang="en">${esc(x.fix)}</b><br><span class="empty">${esc(x.why)}</span></li>`).join('')}</ul>`:'<p class="good">Nenhum erro importante.</p>'}
 <h3>Texto corrigido</h3><div class="passage" lang="en">${esc(r.corrected||'').replace(/\n/g,'<br>')}</div>
 ${r.tip?`<p class="note"><b>Dica:</b> ${esc(r.tip)}</p>`:''}
 ${errs.length?'<div class="row"><button class="btn ghost small" id="w2f" type="button">Mandar as correções para os flashcards</button><span class="empty" id="w2m"></span></div>':''}</div>`;
 const bt=out.querySelector('#w2f');if(bt)bt.onclick=()=>{const n=addCards(errs.map(x=>({en:'Corrija: '+x.original,pt:x.fix})));out.querySelector('#w2m').textContent=n+' cartões criados.';bt.disabled=true}}

/* conversa */
let CV={turns:[],review:null},autoRead=false;
function rules(th){return `You are Sam, a friendly English conversation partner for a Brazilian adult learner at CEFR level A2 who wants to reach B1. Topic of this week: "${th}". Speak only English, with simple and natural vocabulary (A2 to B1). Reply in 1 to 3 short sentences and always end with one question. If the learner writes in Portuguese, answer in simple English and encourage them to try in English. Do not correct mistakes during the chat. Plain text only, no markdown, no emoji. Begin the conversation by greeting the learner and asking a first question about the topic.`}
function vConversa(v){const th=WEEKS[curWeek()].th;
 const b=pshell(v,'Conversa','Fala','Tema: '+th+'. Escreva em inglês como se estivesse falando. No fim, peça a correção.');
 if(!aiGate(b))return;
 b.innerHTML=`<div class="chat" id="chat" aria-live="polite"></div>
  <form id="cf" class="row" style="flex-wrap:nowrap"><input class="txt" id="cin" lang="en" autocomplete="off" placeholder="Write your answer…" aria-label="Sua mensagem"><button class="btn" type="submit" id="csend">Enviar</button></form>
  <label class="empty" for="auto"><input type="checkbox" id="auto" ${autoRead?'checked':''}> Ler as respostas em voz alta</label>
  <div class="row"><button class="btn ghost small" id="cend" type="button">Terminar e corrigir</button><button class="btn ghost small" id="cnew" type="button">Nova conversa</button></div><div id="cout" class="gbody"></div>`;
 const chat=b.querySelector('#chat'),cout=b.querySelector('#cout'),send=b.querySelector('#csend'),cin=b.querySelector('#cin');
 function draw(){chat.innerHTML=CV.turns.map((t,i)=>`<div class="bub ${t.role==='user'?'me':'ai'}" lang="en">${esc(t.content)}${t.role==='assistant'?`<button type="button" class="hear" data-i="${i}" aria-label="Ouvir">▶</button>`:''}</div>`).join('');
  if(!CV.turns.length)chat.innerHTML='<button class="btn" id="cstart" type="button" style="align-self:flex-start">Começar conversa</button>';
  const st=chat.querySelector('#cstart');if(st)st.onclick=()=>{chat.innerHTML='';ask()};
  chat.querySelectorAll('.hear').forEach(x=>x.onclick=()=>say(CV.turns[+x.dataset.i].content,.9));chat.scrollTop=chat.scrollHeight}
 async function ask(){const bub=document.createElement('div');bub.className='bub ai';bub.lang='en';bub.textContent='…';chat.appendChild(bub);chat.scrollTop=chat.scrollHeight;send.disabled=true;
  convCtl=new AbortController();
  try{const {text}=await SAMPLE([{role:'user',content:rules(th)},...CV.turns.slice(-30)],{cache:false,modelTier:'quick',signal:convCtl.signal,onText:({text})=>{bub.textContent=text;chat.scrollTop=chat.scrollHeight}});
   CV.turns.push({role:'assistant',content:text});draw();if(autoRead)say(text,.95)}
  catch(e){bub.remove();if(e.code!=='cancelled')handleErr(e,cout)}finally{send.disabled=false;cin.focus({preventScroll:true})}}
 b.querySelector('#cf').onsubmit=e=>{e.preventDefault();const t=cin.value.trim();if(!t||send.disabled)return;cin.value='';CV.turns.push({role:'user',content:t});draw();ask()};
 b.querySelector('#auto').onchange=e=>{autoRead=e.target.checked};
 b.querySelector('#cnew').onclick=()=>{try{convCtl&&convCtl.abort()}catch(e){}CV={turns:[],review:null};render()};
 b.querySelector('#cend').onclick=async e=>{const mine=CV.turns.filter(t=>t.role==='user').map(t=>t.content);
  if(!mine.length){cout.innerHTML='<p class="badt">Escreva pelo menos uma mensagem antes de pedir a correção.</p>';return}
  const btn=e.currentTarget;btn.disabled=true;cout.innerHTML='<p class="empty">Analisando suas mensagens…</p>';
  try{const r=await SAMPLE.json(`A Brazilian adult learner of English (CEFR A2, goal B1) wrote these messages in a conversation about "${th}". Reply with only JSON:
{"fixes": [{"original": "...", "fix": "...", "why": "short explanation in Brazilian Portuguese"}], "useful": [{"en": "a natural phrase for this topic", "pt": "Portuguese translation"}], "feedback": "two encouraging, specific sentences in Brazilian Portuguese"}
At most 8 fixes (only real mistakes, most important first) and exactly 5 useful phrases.
Messages:
${mine.slice(-25).map(m=>'- '+m).join('\n')}`,{cache:false});
   CV.review=r;renderReview()}catch(err){handleErr(err,cout)}finally{btn.disabled=false}};
 function renderReview(){const r=CV.review;if(!r)return;const fx=Array.isArray(r.fixes)?r.fixes:[],us=Array.isArray(r.useful)?r.useful:[];
  cout.innerHTML=`<div class="end">${r.feedback?`<p>${esc(r.feedback)}</p>`:''}
  <h3>Correções</h3>${fx.length?`<ul class="list">${fx.map(x=>`<li><span class="w-miss" lang="en">${esc(x.original)}</span> → <b class="w-ok" lang="en">${esc(x.fix)}</b><br><span class="empty">${esc(x.why)}</span></li>`).join('')}</ul>`:'<p class="good">Nenhum erro importante.</p>'}
  <h3>Frases úteis</h3><ul class="list">${us.map(x=>`<li><b lang="en">${esc(x.en)}</b> = ${esc(x.pt)}</li>`).join('')}</ul>
  <div class="row"><button class="btn ghost small" id="c2f" type="button">Mandar para os flashcards</button><span class="empty" id="c2m"></span></div></div>`;
  cout.querySelector('#c2f').onclick=ev=>{const n=addCards(us.map(x=>({en:x.en,pt:x.pt})).concat(fx.map(x=>({en:'Corrija: '+x.original,pt:x.fix}))));cout.querySelector('#c2m').textContent=n+' cartões criados.';ev.currentTarget.disabled=true}}
 draw();renderReview();
}

/* leitura */
function vLeitura(v){const th=WEEKS[curWeek()].th;
 const b=pshell(v,'Leitura','Leitura','Textos novos sobre "'+th+'", no seu nível, com áudio, perguntas e glossário.');
 const R=S.lastRead;
 b.innerHTML=`<div class="row"><button class="btn" id="lgo" type="button">${R?'Gerar outro texto':'Gerar texto'}</button></div><div id="lout" class="gbody"></div>`;
 const out=b.querySelector('#lout');if(R)renderRead(out,R);
 b.querySelector('#lgo').onclick=async e=>{const btn=e.currentTarget;
  if(SAMPLE===undefined){out.innerHTML='<p class="empty">Conectando ao Claude…</p>';await SAMPLE_P;SAMPLE=SAMPLE===undefined?await SAMPLE_P:SAMPLE}
  if(!SAMPLE||AI_OFF){out.innerHTML=noAI();return}
  btn.disabled=true;out.innerHTML='<p class="empty">Escrevendo um texto para você… pode levar até um minuto.</p>';
  try{const r=await SAMPLE.json(`Write a short reading text for a Brazilian adult learner of English at CEFR A2 moving to B1. Topic: "${th}". 130 to 170 words, mostly present and past tenses, natural and interesting (not a dialogue). Reply with only JSON:
{"title": "...", "text": "paragraphs separated by \\n\\n", "questions": [{"q": "question in English", "options": ["", "", "", ""], "answer": 0}], "glossary": [{"en": "word or phrase from the text", "pt": "Portuguese meaning"}]}
Exactly 4 comprehension questions (answer = index 0-3 of the correct option) and 6 glossary items.`,{cache:false});
   if(!r||!r.text||!Array.isArray(r.questions))throw{code:'invalid_json'};
   S.lastRead={title:String(r.title||th),text:String(r.text),questions:r.questions.slice(0,6),glossary:Array.isArray(r.glossary)?r.glossary:[],answers:{}};save();renderRead(out,S.lastRead);btn.textContent='Gerar outro texto'}
  catch(err){handleErr(err,out)}finally{btn.disabled=false}};
}
function renderRead(out,R){
 out.innerHTML=`<h3 lang="en">${esc(R.title)}</h3><div class="passage" lang="en">${String(R.text).split(/\n\s*\n/).map(p=>`<p style="margin:0 0 10px">${esc(p)}</p>`).join('')}</div>
  <div class="row"><button class="btn ghost small" id="r1" type="button">▶ Ouvir</button><button class="btn ghost small" id="r2" type="button">Ouvir devagar</button><button class="btn ghost small" id="r3" type="button">Parar</button></div>
  <h3>Perguntas</h3>${R.questions.map((q,i)=>`<div class="gbody" data-q="${i}"><p lang="en"><b>${i+1}.</b> ${esc(q.q)}</p><div class="opts">${(q.options||[]).map((o,k)=>`<button type="button" class="opt" data-k="${k}" lang="en"><kbd>${'ABCD'[k]||''}</kbd><span>${esc(o)}</span></button>`).join('')}</div></div>`).join('')}
  ${R.glossary.length?`<h3>Glossário</h3><ul class="list">${R.glossary.map(g=>`<li><b lang="en">${esc(g.en)}</b> = ${esc(g.pt)}</li>`).join('')}</ul><div class="row"><button class="btn ghost small" id="g2f" type="button">Mandar o glossário para os flashcards</button><span class="empty" id="g2m"></span></div>`:''}`;
 out.querySelector('#r1').onclick=()=>say(R.text,.95);out.querySelector('#r2').onclick=()=>say(R.text,.7);out.querySelector('#r3').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}};
 out.querySelectorAll('[data-q]').forEach(box=>{const i=+box.dataset.q,q=R.questions[i];
  const mark=k=>{box.querySelectorAll('.opt').forEach(o=>{const kk=+o.dataset.k;o.disabled=true;if(kk===Number(q.answer))o.classList.add('right');else if(kk===k)o.classList.add('wrong')})};
  if(R.answers[i]!=null)mark(R.answers[i]);
  box.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{R.answers[i]=+o.dataset.k;save();mark(+o.dataset.k)})});
 const g=out.querySelector('#g2f');if(g)g.onclick=()=>{const n=addCards(R.glossary);out.querySelector('#g2m').textContent=n+' cartões criados.';g.disabled=true};
}

/* pronúncia */
let PR=null;
function vPronuncia(v){
 const b=pshell(v,'Pronúncia','Fala','Ouça o modelo, toque em Falar e diga a frase. Verde: o reconhecimento de voz entendeu. Vermelho: treine de novo.');
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition,inClaude=!!window.claude;
 const help=`<div class="note gbody" style="gap:6px"><p><b>Como usar o microfone:</b> dentro do Claude o microfone fica bloqueado. Baixe o arquivo do app, arraste-o para netlify.com/drop e abra o endereço gerado no Chrome, no computador ou no Android. Toque em Falar e permita o microfone.</p><p class="empty" style="font-size:14px">O reconhecimento de voz do navegador envia o áudio ao serviço de voz do Google (ou da Apple, no Safari). Ouvir o modelo funciona em qualquer lugar.</p></div>`;
 if(!PR)PR={mode:'frases',list:null,i:0,scores:[]};
 if(!PR.list)PR.list=PR.mode==='frases'?shuffle(SENT[0].concat(SENT[1])).slice(0,10):shuffle(VOCAB[Math.min(11,curWeek())].map(p=>p[0]));
 const target=PR.list[PR.i];const avg=PR.scores.length?Math.round(PR.scores.reduce((a,x)=>a+x,0)/PR.scores.length):null;
 b.innerHTML=`${inClaude||!SR?help:''}
  <div class="row"><button type="button" class="btn small${PR.mode==='frases'?'':' ghost'}" data-m="frases">Frases</button><button type="button" class="btn small${PR.mode==='palavras'?'':' ghost'}" data-m="palavras">Palavras do tema</button></div>
  <p class="qmeta"><span>${PR.i+1} de ${PR.list.length}</span><span>${avg==null?'':'Média da rodada: '+avg+'%'}</span></p>
  <p class="qtext" lang="en">${esc(target)}</p>
  <div class="row"><button class="btn ghost" id="m1" type="button">▶ Ouvir modelo</button><button class="btn ghost" id="m2" type="button">Devagar</button><button class="btn" id="rec" type="button" ${SR?'':'disabled'}>Falar</button></div>
  <div id="pout"></div>
  <div class="row"><button class="btn ghost small" id="pnext" type="button">${PR.i<PR.list.length-1?'Próxima':'Nova rodada'}</button></div>`;
 const out=b.querySelector('#pout'),rec=b.querySelector('#rec');
 b.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{PR={mode:x.dataset.m,list:null,i:0,scores:[]};render()});
 b.querySelector('#m1').onclick=()=>say(target,.9);b.querySelector('#m2').onclick=()=>say(target,.6);
 b.querySelector('#pnext').onclick=()=>{if(PR.i<PR.list.length-1)PR.i++;else PR={mode:PR.mode,list:null,i:0,scores:[]};render()};
 rec.onclick=()=>{if(!SR)return;try{speechSynthesis.cancel()}catch(e){}
  const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=5;rec.disabled=true;rec.textContent='Ouvindo…';
  r.onresult=e=>{const alts=Array.from(e.results[0]).map(a=>a.transcript);let best=null;
   alts.forEach(t=>{const c=compareSpoken(target,t);if(!best||c.pct>best.pct)best=Object.assign(c,{heard:t})});
   if(!best)return;PR.scores.push(best.pct);S.pron=S.pron||[];S.pron.push({date:today(),pct:best.pct});if(S.pron.length>500)S.pron=S.pron.slice(-500);save();
   out.innerHTML=`<p class="${best.pct>=80?'good':'badt'}">${best.pct}% das palavras reconhecidas</p><p lang="en" style="font-size:20px">${best.html}</p><p class="empty">O navegador entendeu: “${esc(best.heard)}”</p>`};
  r.onerror=e=>{out.innerHTML=['not-allowed','service-not-allowed','audio-capture'].includes(e.error)?'<p class="badt">O microfone não está disponível aqui.</p>'+(inClaude?'':help):e.error==='no-speech'?'<p class="badt">Não ouvi nada. Tente de novo, mais perto do microfone.</p>':'<p class="badt">O reconhecimento de voz falhou. Tente de novo.</p>'};
  r.onend=()=>{rec.disabled=false;rec.textContent='Falar'};
  try{r.start()}catch(e){rec.disabled=false;rec.textContent='Falar';out.innerHTML='<p class="badt">Não foi possível ligar o microfone aqui.</p>'}};
}

/* hub */

 const pr=(S.pron||[]).slice(-30);const pavg=pr.length?Math.round(pr.reduce((a,x)=>a+x.pct,0)/pr.length):null;
 const wr=(S.writings||[]);const last=wr.length?wr[wr.length-1].score:null;
 const tools=[
  ['flash','Flashcards','Vocabulário','Repetição espaçada, como no Anki, com as palavras de cada semana e os cartões que você cria.',(d.due.length+d.fresh.length)+' cartões para hoje · funciona em qualquer lugar'],
  ['conversa','Conversa','Fala',`Bate-papo em inglês sobre "${th}", com correção dos erros e frases úteis no final.`,'Usa o Claude'],

  ['escrita','Escrita','Escrita','Escreva o texto da semana e receba a correção explicada em português.',(last==null?'':'Última nota: '+last+'/10 · ')+'Usa o Claude'],
  ['leitura','Leitura','Leitura','Textos novos no seu nível, com áudio, perguntas e glossário.','Usa o Claude para gerar'],
  ['jogos','Jogos','Gramática','Pares, Monte a frase, Contra o relógio e Ditado.','Funciona em qualquer lugar'],
 ];
 const g=document.createElement('div');g.className='games';
 g.innerHTML=tools.map(t=>`<a class="gcard" href="#${t[0]}"><span class="sk" style="--c:var(${SKC[t[2]]})">${t[2]}</span><b>${t[1]}</b><span class="gd">${t[3]}</span><small>${t[4]}</small></a>`).join('');
 v.appendChild(g);

/* backup */
function vResult(v){vResultBase(v);
 const c=document.createElement('div');c.className='card';
 c.innerHTML=`<h3>Levar o progresso para outro lugar</h3><p class="empty">O progresso fica salvo neste navegador. Para continuar em outro aparelho, ou no app publicado no Netlify, copie o código aqui e cole lá.</p>
 <div class="row"><button class="btn small" id="bkc" type="button">Copiar código do progresso</button></div>
 <textarea class="txt" id="bkt" rows="3" spellcheck="false" placeholder="Cole aqui um código copiado de outro aparelho" aria-label="Código do progresso"></textarea>
 <div class="row"><button class="btn ghost small" id="bki" type="button">Importar código</button><span class="empty" id="bkm"></span></div>`;
 v.appendChild(c);
 const ta=c.querySelector('#bkt'),m=c.querySelector('#bkm');let armed=false;
 c.querySelector('#bkc').onclick=()=>{const data=Object.assign({},S);delete data.result;const code=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  const fb=()=>{ta.value=code;ta.select();m.textContent='Selecione e copie o código na caixa.'};
  try{navigator.clipboard.writeText(code).then(()=>{m.textContent='Código copiado.'},fb)}catch(e){fb()}};
 c.querySelector('#bki').onclick=()=>{let data;try{data=JSON.parse(decodeURIComponent(escape(atob(ta.value.trim()))))}catch(e){m.textContent='Código inválido. Copie de novo no outro aparelho.';return}
  if(!armed){armed=true;m.textContent='Isso substitui o progresso deste navegador. Toque em Importar de novo para confirmar.';return}
  S=Object.assign({done:{}},data);S.result=R0;FQ=null;save();m.textContent='Progresso importado.';setTimeout(render,700)};
}

/* ---------- timer ---------- */
const T={id:null,left:0,key:null,run:false,iv:null};
const tEl=document.getElementById('timer');
function tick(){if(!T.run)return;T.left--;paint();if(T.left<=0){clearInterval(T.iv);T.run=false;S.done[T.key]=true;save();beep();document.getElementById('tlabel').textContent='Bloco concluído e marcado.';document.getElementById('tpause').hidden=true;render()}}
function paint(){const m=Math.floor(T.left/60),s=T.left%60;document.getElementById('tclock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function startTimer(key,min,label){clearInterval(T.iv);T.key=key;T.left=min*60;T.run=true;tEl.hidden=false;document.getElementById('tpause').hidden=false;document.getElementById('tpause').textContent='Pausar';document.getElementById('tlabel').textContent=label;paint();T.iv=setInterval(tick,1000)}
document.getElementById('tpause').onclick=e=>{T.run=!T.run;e.target.textContent=T.run?'Pausar':'Continuar'};
document.getElementById('tstop').onclick=()=>{clearInterval(T.iv);T.run=false;tEl.hidden=true};
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.2);o.start(c.currentTime+t);o.stop(c.currentTime+t+.22)})}catch(e){}}

window.addEventListener('hashchange',render);
render();
</script>
